matching: Full 5-to-3 DNA exact sequence, same gene and role; modifications separate;
  no automatic reverse complement. Complete pairs require both matching members in
  one generated pair. Unpublished candidates are not false positives.
execution_history:
  first_launch: '2026-10-31T11:21:53+08:00'
