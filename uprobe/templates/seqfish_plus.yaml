# U-Probe protocol template: seqFISH+ primary probes.
# Copy: `uprobe templates show seqfish_plus -o protocol.yaml`, then replace
# everything under meta.replace. The workflow ignores the `meta` block.
meta:
  name: seqfish_plus
  technology: seqFISH+ primary probes
  description: >-
    Each primary probe has a 28-nt region complementary to the coding sequence
    and four 15-nt overhangs, one per barcoding round; in each round a
    dye-labelled 15-nt readout probe binds the overhang assigned to that gene's
    pseudocolor. Two overhangs sit on each side of the target region (Eng et
    al. 2019 Fig. 1a), separated by 1-nt T spacers, and the oligo is ordered
    with the forward primer at its 5' end and the reverse complement of the T7
    promoter at its 3' end: 5'-[primer 21][R][T][R][T][target 28][T][R][T][R]
    [rc(T7) 20]-3', 133 nt. This is the layout of the only public probe
    sequences that reuse the seqFISH+ readouts and primer (Lohoff et al. 2022),
    which also rotate which round sits in which slot from probe to probe.
    After amplification (USER removes the forward primer; T7 transcription and
    reverse transcription) about 95 nt remain. 24 primary probes are used per
    gene.
  citations:
    - short: Eng et al. 2019, Nature
      title: Transcriptome-scale super-resolved imaging in tissues by RNA seqFISH+
      doi: 10.1038/s41586-019-1049-y
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6544023/
    - short: Lohoff et al. 2022, Nature Biotechnology (seqFISH probe sequences)
      title: Integration of spatial and single-cell transcriptomic data elucidates mouse organogenesis
      doi: 10.1038/s41587-021-01006-2
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8763645/
  parameter_sources:
    - parameter: extracts.target_region.length and source
      value: 28 nt from CDS exons
      source: Eng 2019, Methods
      quote: 28-nt sequences of each gene were extracted first using the exons from within the CDS region
    - parameter: extracts.target_region.transcripts
      value: mane (the CDS of the MANE Select transcript, the Ensembl canonical one without it)
      source: >-
        Eng 2019 designed "as previously described", i.e. as Eng 2017 (RNA
        SPOTs, Methods), on the regions shared by all spliced isoforms. U-Probe
        has no shared-region option; the reference transcript's CDS contains
        them, and never adds exons of other isoforms.
      quote: Consensus regions of all spliced isoforms were identified (Eng 2017)
    - parameter: post_process.filters.target_gc
      value: 0.45-0.65
      source: Eng 2019, Methods
      quote: GC content in the range of 45-65%
    - parameter: post_process.filters.homopolymers
      value: runs of 5 or more identical bases excluded
      source: Eng 2019, Methods
      quote: Any probe sequences that contained five or more consecutive bases of the same kind were dropped
    - parameter: readout overhangs
      value: 4 x 15 nt (I-IV), two on each side of the target region
      source: Eng 2019, Methods and Fig. 1a schematic
      quote: Overhang sequences (I-IV) on the primary probes correspond to 4 barcoding rounds ... 15-nt readout probes were designed
    - parameter: primary_probe.template (1-nt T spacers, forward primer, rc(T7) tail)
      value: "GTCTTATCATGTGCCTTTCCT [R] T [R] T [binding] T [R] T [R] CCCTATAGTGAGTCGTATTA"
      source: >-
        Lohoff 2022, Supplementary Table 1A: all 15,177 barcoded probes (351
        genes, 135 nt with a 30-nt target region) are this 21-nt primer, two
        readouts, the target region and two readouts with a T between every
        two of them, and the reverse complement of the T7 promoter. The
        Methods text says "2-nucleotide spacer", but the sequences have 1 T.
        Eng 2019 publishes no probe sequences; its ~93-nt final probes fit 88
        nt of readouts and target plus spacers and the CCC that T7
        transcription leaves at the 3' end.
      quote: We used validated primer and 84 readout sequences, previously used in seqFISH+ (Lohoff 2022, Methods)
    - parameter: readout slot rotation (probe_index)
      value: "the rounds shift by one slot per probe (probe_index 0, 1, 2, 3): 12|34, 23|41, 34|12, 41|23"
      source: >-
        Lohoff 2022, Supplementary Table 1A: every gene's probes cycle through
        these four slot orders (in table row order). The template numbers a
        gene's probes along the RNA (probe_index) and rotates the same way.
    - parameter: attributes.target_mapped_genes.exempt_copies
      value: "{kmer: 30, min_shared: 0.5}"
      source: >-
        U-Probe, as in smfish_stellaris. A false spot needs many probes of the
        set on one RNA; a gene with a transcript holding at least half of the
        target's 30-mers (a processed pseudogene, a retrocopy) is hit by any
        probe set, so unless it is protein_coding (GTF gene_biotype/gene_type)
        it is listed in target_mapped_genes_copies instead of counted, whatever
        its expression. Mouse Gapdh (seqFISH+ template, NIH/3T3 expression): 2 of
        24 probes without it, 24 with it (44 copies, Gm13394 among them).
    - parameter: post_process.filters.target_mapped_genes
      value: "<= 1, no other gene with a site within 2 substitutions (Bowtie 1, exhaustive)"
      source: >-
        U-Probe approximation. Eng 2019 counted 15-nt BLAST matches to other
        genes as off-targets and dropped probes whose expected off-target
        expression exceeded 10,000 FPKM, which U-Probe does not model (a
        gene_expression table makes unexpressed genes not count).
      quote: BLAST hits on any sequences other than the target gene with a 15-nt match were considered off targets
    - parameter: post_process.equal_space.number_desired
      value: 24
      source: Eng 2019, Methods (24 primary probes per gene; see meta.limitations)
  hybridization:
    ssc: 2x
    source: >-
      Eng 2019, Methods (40% formamide, 2x SSC, 10% dextran sulfate; 37 C for
      36-48 h in cells); Cai lab seqFISH+ protocol (about 1 nM per probe)
    notes: >-
      [Na+] computed from 2x SSC (0.3 M NaCl + 0.03 M trisodium citrate).
      Readout probes are hybridized at room temperature in 10% ethylene
      carbonate, 10% dextran sulfate, 4x SSC.
  limitations:
    - Lohoff 2022 rotates the slot order in the row order of its probe table, which is not the order along the transcript; the template rotates along the RNA.
    - Eng 2019 added UTR exons for genes whose CDS gave too few probes; the template uses the CDS only (source mRNA adds the UTRs, for every gene).
    - Eng 2019 dropped genes with fewer than 24 probes and used 24 per gene; equal_space keeps 24, spread evenly along the CDS, and all passing regions of a gene with fewer (summary.json reports the shortfall; drop such genes as Eng 2019 did).
    - "The 5'/3' order of the overhangs, the spacers and the primers follow Lohoff 2022, which reuses the seqFISH+ readouts and primer; the Eng 2019 library sequences themselves are not public."
    - "TODO: verify the minimum spacing between primary probes; regions are only required not to overlap here."
  replace:
    - "genome: a genome name from your genomes.yaml (hg38 here); its align_index must include bowtie (Bowtie 1) for target_mapped_genes"
    - "targets: your gene names (GAPDH here)"
    - "encoding: per gene, readouts: the readout PROBE sequences of rounds I-IV, in round order (placeholders N here; the seqFISH+ readouts are not in Eng 2019's tables); the template inserts their reverse complements"
    - "primary_probe.primer_fwd: the forward primer of your library (here the seqFISH+ primer of Lohoff 2022); keep CCCTATAGTGAGTCGTATTA (rc of T7) if you amplify by T7 transcription"

name: seqfish_plus
description: seqFISH+ primary probes, 28-nt target region with four 15-nt readout overhangs (Eng et al. 2019)

genome: hg38

targets:
  - GAPDH

encoding:
  GAPDH:
    readouts:  # the gene's readout probes, rounds I-IV in order
      - NNNNNNNNNNNNNNN  # PLACEHOLDER: 15-nt readout probe, round I
      - NNNNNNNNNNNNNNN  # PLACEHOLDER: 15-nt readout probe, round II
      - NNNNNNNNNNNNNNN  # PLACEHOLDER: 15-nt readout probe, round III
      - NNNNNNNNNNNNNNN  # PLACEHOLDER: 15-nt readout probe, round IV

extracts:
  target_region:
    source: CDS
    transcripts: mane   # the MANE Select transcript (Ensembl canonical without one)
    length: 28
    step: 1

probes:
  primary_probe:
    # Pool oligo (Lohoff 2022 layout): primer, overhangs and target region with
    # 1-nt T spacers, then the reverse complement of the T7 promoter.
    template: "{primer_fwd}{overhang_1}T{overhang_2}T{binding}T{overhang_3}T{overhang_4}{t7_rc}"
    parts:
      primer_fwd:
        template: "GTCTTATCATGTGCCTTTCCT"  # seqFISH+ forward primer (Lohoff 2022); replace with yours
        parts: {}
      # The rounds shift by one slot per probe (probe_index, numbered along the
      # RNA): 12|34, 23|41, 34|12, 41|23, so every round takes every slot in turn.
      overhang_1:
        expr: "rc(encoding[target]['readouts'][probe_index % 4])"
      overhang_2:
        expr: "rc(encoding[target]['readouts'][(probe_index + 1) % 4])"
      binding:
        expr: "rc(target_region)"
      overhang_3:
        expr: "rc(encoding[target]['readouts'][(probe_index + 2) % 4])"
      overhang_4:
        expr: "rc(encoding[target]['readouts'][(probe_index + 3) % 4])"
      t7_rc:
        template: "CCCTATAGTGAGTCGTATTA"  # reverse complement of the T7 promoter
        parts: {}

# Hybridization conditions of the source protocol (sources: meta.hybridization).
# annealing_temperature and fold_score attributes are computed under them.
hybridization:
  temperature_c: 37
  na_mM: 390
  probe_nM: 1
  formamide_pct: 40
  dntp_mM: 0   # FISH buffers hold no dNTPs (unset, the legacy 0.6 mM would apply)

attributes:
  target_gc:
    target: target_region
    type: gc_content
  binding_tm:
    target: primary_probe.binding
    type: annealing_temperature
  target_mapped_genes:
    target: target_region
    type: mapped_genes
    # Bowtie 1 finds every transcript site within 2 substitutions; it needs
    # bowtie in the genome's align_index. Bowtie2 (aligner: bowtie2, a local
    # seed heuristic) flagged only 88% of random 28-nt windows of human mRNAs
    # that have such a site in another gene (Ensembl 113 transcriptome).
    aligner: bowtie
    max_mismatches: 2
    strand: sense   # sites where target_region occurs, which rc(target_region) binds
    # Copies of the target that are not protein_coding (processed pseudogenes,
    # retrocopies) are listed in target_mapped_genes_copies instead of counted
    # (meta.parameter_sources).
    exempt_copies: {kmer: 30, min_shared: 0.5}

post_process:
  filters:
    target_gc:
      condition: target_gc >= 0.45 & target_gc <= 0.65
    homopolymers:
      type: sequence_pattern
      target: target_region
      exclude_patterns: [AAAAA, TTTTT, CCCCC, GGGGG]
    target_mapped_genes:
      condition: target_mapped_genes <= 1
  sorts:
    is_ascending:
      - target_mapped_genes
  remove_overlap:
    location_interval: 0
  equal_space:
    number_desired: 24

summary:
  report_name: rna_report
  attributes:
    - target_gc
    - binding_tm
    - target_mapped_genes
