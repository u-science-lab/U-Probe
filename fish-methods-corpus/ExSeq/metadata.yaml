probe:
  architecture_type: "Untargeted cDNA circles or targeted barcoded DNA padlocks; see version scopes."
  target_binding: "Random-octamer RT (V01); adjacent terminal padlock arms, 16 nt each by default (V02-V04)."
  barcode_system: null
  readout_system: "SOLiD ligation (V01/V03); Illumina SBS (V02); configurable targeted readout (V04)."
  amplification: "Phi29 rolling-circle amplification."
  sequencing_or_imaging: "Multiround fluorescence imaging of expanded specimens."
  modifications: ["Padlock 5'-phosphate", "RCA-primer phosphorothioate bonds", "Aminoallyl-dUTP and amplicon cross-linking"]
design:
