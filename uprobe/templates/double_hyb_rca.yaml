# U-Probe protocol template: double-hybridization RCA (circle probe + amplification primer).
# Copy: `uprobe templates show double_hyb_rca -o protocol.yaml`, then replace
# everything under meta.replace. The workflow ignores the `meta` block.
meta:
  name: double_hyb_rca
  technology: Double-hybridization RCA (circle probe + amplification primer)
  description: >-
    Two oligos bind one 40-nt RNA window. The circle (padlock) probe is
    5'-[rc of window nt 1-13][barcode 1][N][barcode 2][rc of window nt 14-26]-3',
    so both ends meet on the RNA for ligation. The amplification primer is
    5'-[rc of window nt 28-40][N][rc of barcode 2]-3': its 5' part binds the
    RNA next to the circle probe and its 3' end binds barcode 2 of the circle,
    so it primes rolling circle amplification only when both oligos sit on the
    same molecule. This is the RCA probe configuration described in the
    U-Probe preprint and shipped as tests/data/double_hyb_rca.yaml, ported to
    the current protocol syntax (step instead of overlap, mapped_genes instead
    of n_mapped_genes, encoding[target] instead of encoding[gene_id]) with
    unchanged lengths. One unit gives one rolling-circle product and thus one
    spot, so the off-target filters are the strict per-unit rule: no other
    gene on the 40-nt window or on the 26-nt arm site. The two-oligo layout
    (13-nt padlock arms, one skipped nucleotide, 13-nt primer site) is the one
    of MiP-seq.
  citations:
    - short: Zhang et al. 2026, bioRxiv (U-Probe)
      title: Universal agentic probe design for imaging-based spatial-omics
      doi: 10.64898/2026.04.12.717982
    - short: Wu et al. 2024, Nature Biomedical Engineering (MiP-seq)
      title: Spatial multi-omics at subcellular resolution via high-throughput in situ pairwise sequencing
      doi: 10.1038/s41551-024-01205-7
    - short: Wu et al. 2023, bioRxiv (MiP-Seq preprint, Methods)
      title: Development of Multiomics in situ Pairwise Sequencing (MiP-Seq)
      doi: 10.1101/2023.01.07.523058
  parameter_sources:
    - parameter: probe layout, lengths and Tm filters
      value: "circle arms target_region[0:13] and [13:26]; primer site target_region[-13:]; Tm 35-45 C"
      source: U-Probe example protocol tests/data/double_hyb_rca.yaml (design described in the U-Probe preprint)
      quote: an RCA probe configuration specifies a circle probe with target-complementary arms flanking barcodes, plus an amplification probe referencing both the circle probe and target region (U-Probe preprint)
    - parameter: post_process.filters.n_mapped_genes and arm_mapped_genes
      value: "both <= 1: no other gene on the 40-nt window, nor on the 26-nt arm site"
      source: >-
        U-Probe choice, replacing the test protocol's n_mapped_genes <= 4 (up
        to 3 off-target genes per unit). One ligated circle with its primer
        gives one rolling-circle product, which is counted as one molecule,
        so a unit that also sits on another transcript produces false spots;
        there is no multi-probe averaging as in smFISH. The same rule is used
        by the other padlock templates (padlock_iss, mipseq, starmap).
        Specificity rests mostly on the arm site and its ligation junction:
        the 17-nt barcode-2 duplex alone can hold the primer on any ligated
        circle. The 26-nt arm site is therefore searched on its own, with
        Bowtie 1 (exhaustive within 2 substitutions; Bowtie2's local mode
        misses many sites of 25-30-nt sequences), and the 40-nt window with
        Bowtie2, as in mipseq and starmap.
    - parameter: post_process.sorts (circle_fold_score, amp_fold_score) without a fold filter
      value: "ascending fold sorts, no threshold"
      source: >-
        U-Probe choice, replacing the test protocol's circle_fold_score <= 80.
        fold_score is -MFE (kcal/mol, >= 0), so the filter removed nothing:
        on 4,375 circle probes built from 875 human CDS windows and 5 random
        17-nt barcode pairs the score is 14.3 (median), 21.0 (90th
        percentile) and 37.2 at most. A threshold is also barcode-dependent
        (with the N placeholders below, which fold as poly-A, the median is
        1.9), so the template only ranks the least structured units first and
        leaves the threshold to the user: <= 21 kept 90% of those probes.
    - parameter: amp_probe orientation (target-binding 5', circle-binding 3')
      value: "{part2}N{part1}"
      source: >-
        MiP-Seq preprint Methods. The test protocol had the reverse order
        ({part1}N{part2}), which leaves the primer's 3' end on the RNA instead
        of on the circle; U-Probe's own tests/data/RNA_format.yaml and the
        published MiP-seq primers put the target-binding part at the 5' end.
      quote: The 5' end of the RCA initiator primer is complementary to the 3' end of the targeting sequence (12-16 bp), and the 3' end is complementary to the padlock probe
    - parameter: extracts.target_region (length 40, step 20)
      value: "length 40, step 20 (overlap 20 in the test protocol)"
      source: U-Probe example protocol tests/data/double_hyb_rca.yaml
    - parameter: extracts.target_region.source and transcripts
      value: CDS of the MANE Select transcript, the Ensembl canonical one without it
      source: >-
        U-Probe choice; no published source. The test protocol's source exon
        is the CDS of protein-coding genes; the windows are restricted to the
        reference transcript, as in the other templates.
  hybridization:
    ssc: 2x
    source: >-
      Not stated for this design (TODO: verify); values are those of the
      closest published protocol, MiP-Seq (2X SSC, 10% formamide, 20 mM RVC,
      overnight at 37 C; SplintR ligation at 37 C; Phi29 RCA at 30 C).
    notes: "[Na+] computed from 2x SSC (0.3 M NaCl + 0.03 M trisodium citrate)."
  limitations:
    - The Tm filters (35-45 C) were set for U-Probe's legacy annealing_temperature conditions (50 mM Na+, 50 nM oligo, no formamide); tm1-tm3 keep those conditions through their own hybridization setting, while the top-level hybridization block holds the (unverified) experimental conditions.
    - circle_fold_score and amp_fold_score include the barcodes, so they are only meaningful after the placeholder barcodes are replaced; they sort the units and filter none (see parameter_sources).
    - Bowtie2 on the 40-nt window is a local heuristic that reports at most 100 alignments; the exhaustive search within 2 substitutions covers the 26-nt arm site only. Set n_mapped_genes to aligner bowtie, max_mismatches 2 to search the whole window exhaustively as well.
  replace:
    - "genome: a genome name from your genomes.yaml (hg38 here); its align_index must include bowtie (Bowtie 1) for arm_mapped_genes and bowtie2 for n_mapped_genes"
    - "targets: your gene names (GAPDH here)"
    - "encoding: per gene, barcode1 and barcode2 (17-nt N placeholders, the lengths of the test protocol's barcodes)"
    - "circle_probe.part2 and amp_probe: each template holds a literal N, a 1-nt spacer (between the two barcodes; between the primer's RNA part and its barcode-2 part). Replace both with defined bases: an N is synthesized as a mix of all four"

name: double_hyb_rca
description: Double-hybridization RCA probes, circle probe with two barcodes plus amplification primer

genome: hg38

targets:
  - GAPDH

encoding:
  GAPDH:
    barcode1: NNNNNNNNNNNNNNNNN  # PLACEHOLDER: 17-nt barcode 1
    barcode2: NNNNNNNNNNNNNNNNN  # PLACEHOLDER: 17-nt barcode 2 (also bound by the amplification primer)

extracts:
  target_region:
    source: CDS
    transcripts: mane   # the MANE Select transcript (Ensembl canonical without one)
    length: 40
    step: 20
    # Only for the off-target search: the 26 nt both circle arms bind, which
    # carry most of the specificity (meta.parameter_sources).
    layout:
      template: "{arm_site}{gap}{primer_site}"
      parts:
        arm_site:
          length: 26
        gap:
          length: 1
        primer_site:
          length: 13

probes:
  circle_probe:
    template: "{part1}{part2}{part3}"
    parts:
      part1:
        length: 13
        expr: "rc(target_region[0:13])"
      part2:
        template: "{barcode1}N{barcode2}"   # PLACEHOLDER N: a 1-nt spacer, replace with a defined base
        parts:
          barcode1:
            expr: "encoding[target]['barcode1']"
          barcode2:
            expr: "encoding[target]['barcode2']"
      part3:
        length: 13
        expr: "rc(target_region[13:26])"

  amp_probe:
    template: "{part2}N{part1}"   # PLACEHOLDER N: a 1-nt spacer, replace with a defined base
    parts:
      part1:
        expr: "rc(circle_probe.part2.barcode2)"
      part2:
        expr: "rc(target_region[-13:])"

# Hybridization conditions, taken from MiP-Seq (TODO: verify; see meta.hybridization).
# annealing_temperature and fold_score attributes are computed under them.
hybridization:
  temperature_c: 37
  na_mM: 390
  formamide_pct: 10

attributes:
  fold_score:
    target: circle_probe:part1
    type: fold_score
  n_mapped_genes:
    target: target_region
    type: mapped_genes
    # The 40-nt window that both oligos bind. Bowtie2 also reports partial
    # matches (about 25 nt or more), indels and sites with 3 or more
    # mismatches, which a search within 2 substitutions cannot see, but it is a
    # heuristic that reports at most 100 alignments: on the Ensembl 113 human
    # transcriptome it flagged 97% of random 40-nt windows of mRNAs that have a
    # site within 2 substitutions in another gene, and listed 87% of those
    # genes per window. For an exhaustive search of those sites, add bowtie to
    # the genome's align_index and set aligner: bowtie, max_mismatches: 2.
    aligner: bowtie2
    strand: sense   # sites where target_region occurs, which the probes bind
  arm_mapped_genes:
    target: target_parts.arm_site
    type: mapped_genes
    # The 26 nt the circle's two arms bind and ligate on. Bowtie 1 finds every
    # site within 2 substitutions; Bowtie2's local mode misses many sites of
    # sequences this short, and the primer's 17-nt tail can hold it on any
    # ligated circle, so this site carries most of the specificity.
    aligner: bowtie
    max_mismatches: 2
    strand: sense
  target_gc_content:
    target: target_region
    type: gc_content
  tm1:
    target: circle_probe:part1
    type: annealing_temperature
    # Legacy conditions, under which the 35-45 C filters were set (meta.limitations).
    hybridization: {na_mM: 50, mg_mM: 0, dntp_mM: 0.6, probe_nM: 50, formamide_pct: 0}
  tm2:
    target: circle_probe:part3
    type: annealing_temperature
    hybridization: {na_mM: 50, mg_mM: 0, dntp_mM: 0.6, probe_nM: 50, formamide_pct: 0}
  tm3:
    target: amp_probe:part2
    type: annealing_temperature
    hybridization: {na_mM: 50, mg_mM: 0, dntp_mM: 0.6, probe_nM: 50, formamide_pct: 0}
  circle_fold_score:
    target: circle_probe
    type: fold_score
  amp_fold_score:
    target: amp_probe
    type: fold_score

post_process:
  filters:
    tm1:
      condition: tm1 >= 35 & tm1 <= 45
    tm2:
      condition: tm2 <= 45 & tm2 >= 35
    tm3:
      condition: tm3 <= 45 & tm3 >= 35
    # One unit makes one spot, so no other gene may carry the window or the
    # arm site (meta.parameter_sources).
    n_mapped_genes:
      condition: n_mapped_genes <= 1
    arm_mapped_genes:
      condition: arm_mapped_genes <= 1
  sorts:
    # Least structured first: fold_score is -MFE, so lower means less
    # structure. No threshold: it would depend on your barcodes (meta).
    is_ascending:
      - circle_fold_score
      - amp_fold_score
      - tm1
  remove_overlap:
    location_interval: 0

summary:
  report_name: rna_report
  attributes:
    - tm1
    - tm2
    - tm3
    - target_gc_content
    - n_mapped_genes
    - arm_mapped_genes
    - circle_fold_score
