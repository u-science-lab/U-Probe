name: uprobe

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.10
  - pysam
  - bowtie2
  - bowtie      # Bowtie 1: exhaustive off-target search (mapped_genes with aligner: bowtie)
  - blast
  - mmseqs2
  - jellyfish
  - pip
  - pip:
      - -r requirements.txt
