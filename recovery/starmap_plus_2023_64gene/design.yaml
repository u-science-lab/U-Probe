extracts:
  target_region:
    source: mRNA
    length:
    - 39
    - 52
    step: 1
    transcripts: all
    layout:
      template: '{padlock_site}{gap}{primer_site}'
      parts:
        padlock_site:
          length:
          - 19
          - 25
        gap:
          length:
          - 1
          - 2
        primer_site:
          length:
          - 19
          - 25
probes:
  padlock:
    template: '{sequence}'
    modifications:
      5prime: phosphate
    parts:
      sequence:
        expr: '''A'' + encoding[target][''code''] + ''TA'' + rc(target_parts[''padlock_site''])
          + ''AATTATTAC'' + encoding[target][''code''] + ''CATACACTAAAGATA'''
  primer:
    template: '{sequence}'
    parts:
      sequence:
        expr: rc(target_parts['primer_site']) + 'TA' + rc(encoding[target]['code'])
          + 'TTATCTT'
attributes: {}
post_process: {}
recovery_execution:
  transcript_policy: each annotated isoform separately through UProbeAPI, not merged
    exon model
  alphabet: ACGT only; upper-case before construction
  filters: no GC/Tm/off-target thresholds; published thresholds unavailable
  final_selection: not applied
  candidate_deduplication: gene + uppercase target window + layout
  no_reference_binding_input: true
