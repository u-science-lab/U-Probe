method:
  official_name: MERFISH
  full_name: Multiplexed error-robust fluorescence in situ hybridization
  aliases:
  - MERFISH
classification:
  categories:
  - multiplexed_smfish
  - spatial_transcriptomics
  applications:
  - rna_copy_number
  - subcellular_rna_localization
  - spatial_gene_expression
  # Controlled two-level classification (corpus_schema.md "Method classification").
  probe_architecture: linear
  readout_strategy:
  - sequential_fish
  classification_evidence_status: reported
  classification_source: S01
  classification_notes: Linear ssDNA encoding probes with 30-nt target-binding regions; readout relies on iterative fluorescent-oligo hybridization, imaging, and photobleaching/chemical cleavage. V02-V06 are variants on the same linear/sequential architecture; V05 adds bDNA signal amplification but the readout mechanism remains sequential.
