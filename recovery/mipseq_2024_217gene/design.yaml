meta:
  recovery_execution:
    encoding_variants: cartesian
    spacer_policy: All A/C/G/T and AC/CC/GC/TC spacer variants applied to every site
      and code; no binding sequences or site coordinates.
    candidate_scope: All annotated transcripts, full mRNA, step 1; no selection or
      physicochemical filters.
extracts:
  target_region:
    source: mRNA
    transcripts: all
    length: 40
    step: 1
    layout:
      template: '{arm5_site}{arm3_site}{gap}{primer_site}'
      parts:
        arm5_site:
          length: 13
        arm3_site:
          length: 13
        gap:
          length: 1
        primer_site:
          length: 13
probes:
  padlock:
    template: '{arm_5}CC{b1}TGCGTCTATTTGT{b2}TAGTGGAGCCT{arm_3}'
    parts:
      arm_5:
        expr: rc(target_parts['arm5_site'])
      b1:
        expr: encoding[target]['variants'][probe_index % encoding[target]['variant_count']]['B1']
      b2:
        expr: encoding[target]['variants'][probe_index % encoding[target]['variant_count']]['B2']
      arm_3:
        expr: rc(target_parts['arm3_site'])
  rca_primer:
    template: '{binding}{spacer}AGGCTCCACTA'
    parts:
      binding:
        expr: rc(target_parts['primer_site'])
      spacer:
        expr: encoding[target]['variants'][probe_index % encoding[target]['variant_count']]['spacer']
