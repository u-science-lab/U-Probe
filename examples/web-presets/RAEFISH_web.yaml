barcodes:
  count: 9
  barcodes:
    BC1: {length: 30, description: "Shared library padlock 3-prime common region"}
    BC2: {length: 20, description: "Shared library priming 5-prime common region"}
    BC3: {length: 10, description: "Shared library RCA primer terminus"}
    BC4: {length: 20, description: "Shared library encoding 5-prime common region"}
    BC5: {length: 20, description: "Panel readout 1"}
    BC6: {length: 20, description: "Panel readout 2"}
    BC7: {length: 20, description: "Panel readout 3"}
    BC8: {length: 20, description: "Panel readout 4"}
    BC9: {length: 20, description: "Shared library encoding 3-prime common region"}
# V01 research template, not synthesis-ready. N segments are unresolved
# common sequences/readouts and require panel-specific validated replacements.
# Target window is two adjacent 30 nt regions (zero gap), in RNA 5'->3' order.
# The 1 nt gap option, off-target analysis, and V02 are not implemented.
extracts:
  target_region: {source: mRNA, length: 60, step: 1}
probes:
  padlock:
    template: '{common5}{binding}{common3}'
    modifications: {5prime: phosphate}
    parts:
      common5: {template: ACTCTCACTTGGGTTCCAAT, parts: {}}
      binding: {expr: 'rc(target_region[0:30])'}
      common3: {expr: "encoding[target]['BC1']"}
  priming:
    template: '{common5}{binding}{primer}'
    parts:
      common5: {expr: "encoding[target]['BC2']"}
      binding: {expr: 'rc(target_region[30:60])'}
      primer: {expr: "encoding[target]['BC3']"}
  encoding_probe:
    template: '{common5}{readout1}{readout2}{binding}{readout3}{readout4}{common3}'
    parts:
      common5: {expr: "encoding[target]['BC4']"}
      readout1: {expr: "encoding[target]['BC5']"}
      readout2: {expr: "encoding[target]['BC6']"}
      binding: {expr: 'rc(target_region[0:30])'}
      readout3: {expr: "encoding[target]['BC7']"}
      readout4: {expr: "encoding[target]['BC8']"}
      common3: {expr: "encoding[target]['BC9']"}

# Descriptive measurement; source supplies no GC threshold.
attributes:
  target_gc: {target: target_region, type: gc_content}
# Explicitly empty filters suppress unrelated automatically generated thresholds.
post_process:
  filters: {}
