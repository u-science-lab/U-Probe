  reference: S01
  status: original
- version_id: V02
  version_name: 64-plex configuration (corpus label)
  year: 2025
  reference: S01
  status: variant
probe:
  architecture_type: RNA-targeted padlock with four barcode segments
  target_binding: Terminal complementary arms; see scoped exceptions in probes.md
  barcode_system: Four-channel color-intensity codewords
  readout_system: Competitive labeled/unlabeled imaging-probe binding to RCA products
  amplification: Rolling circle amplification
  sequencing_or_imaging: Single-round multichannel fluorescence imaging
  modifications:
  - 5-prime padlock phosphorylation
  - Phosphorothioate RCA-primer linkages
  - Fluorophore-labeled imaging probes
