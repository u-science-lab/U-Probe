extracts:
  target_region:
    source: mRNA
    length: 32
    step: 1
    transcripts: all
probes:
  padlock:
    template: '{arm5}AAA{solid}TCTCGGGAACGCTGAAGACGGC{illumina}AAA{arm3}'
    modifications:
      5prime: phosphate
      3prime: hydroxyl
    parts:
      arm5:
        expr: rc(target_region[0:16])
      solid:
        expr: encoding[target]['variants'][probe_index % encoding[target]['variant_count']]['solid']
      illumina:
        expr: encoding[target]['variants'][probe_index % encoding[target]['variant_count']]['illumina']
      arm3:
        expr: rc(target_region[16:32])
attributes: {}
post_process: {}
recovery_execution:
  encoding_variants: cartesian
  transcript_policy: Each annotated isoform separately through UProbeAPI; exact S9 RefSeq versions are
    not present in the local GENCODE annotation.
  candidate_policy: All ACGT 32-mer windows, deduplicated by gene and sequence, crossed with every public
    gene-specific physical barcode pair. No reference binding arms or oligos are inputs.
  paper_qc: Reject homopolymers longer than 4, arm GC outside 40-65%, temperature criterion, significant
    hairpin/dimer, and off-target BLAST hits longer than 12 nt spanning the junction by at least 3 nt
    each side. Advance 5 nt beyond a passing window; otherwise advance 1 nt.
  final_selection: 'Not executed: original RefSeq versions, adaptive Tm details, significant secondary-structure
    thresholds, historical BLAST database and random selection seed are unavailable. Paper randomly selects
    up to 8 probes per gene.'
