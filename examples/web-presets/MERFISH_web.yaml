barcodes:
  count: 5
  barcodes:
    BC1: {length: 20, description: "Shared library PCR primer 1"}
    BC2: {length: 20, description: "Panel readout 1"}
    BC3: {length: 20, description: "Panel readout 2"}
    BC4: {length: 20, description: "Panel readout 3"}
    BC5: {length: 20, description: "Shared library PCR primer 2 reverse-complement strand"}
# Research template: replace primer and readout placeholders with a validated panel.
# Moffitt 2016 uses three readout sites per probe and a four-bit gene code;
# this static configuration does not rotate the omitted site across probes.
extracts:
  target_region: {source: mRNA, length: 30, step: 1}
probes:
  encoding_probe:
    template: '{primer1}A{readout1}{binding}A{readout2}{readout3}{primer2_rc}'
    parts:
      primer1: {expr: "encoding[target]['BC1']"}
      readout1: {expr: "encoding[target]['BC2']"}
      binding: {expr: 'rc(target_region)'}
      readout2: {expr: "encoding[target]['BC3']"}
      readout3: {expr: "encoding[target]['BC4']"}
      primer2_rc: {expr: "encoding[target]['BC5']"}
attributes:
  target_gc: {target: target_region, type: gc_content}
  # Moffitt 2016 TRDesigner design model, not hybridization-buffer Tm.
  binding_tm: {target: encoding_probe.binding, type: annealing_temperature, tm_method: merfish_design, hybridization: {na_mM: 300, probe_nM: 5}}
post_process:
  filters:
    target_gc: {condition: 'target_gc >= 0.43 & target_gc <= 0.63'}
    binding_tm: {condition: 'binding_tm >= 66 & binding_tm <= 76'}
