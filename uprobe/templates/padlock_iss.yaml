# U-Probe protocol template: padlock-probe in situ sequencing with RCA (HybISS).
# Copy: `uprobe templates show padlock_iss -o protocol.yaml`, then replace
# everything under meta.replace. The workflow ignores the `meta` block.
meta:
  name: padlock_iss
  technology: Padlock-probe in situ sequencing with RCA (HybISS)
  description: >-
    mRNA is reverse transcribed in situ and the padlock probe (PLP) binds a
    30-nt cDNA site with two 15-nt arms; ligation circularizes it and RCA
    copies the backbone. Because the padlock binds cDNA, its arms carry the
    mRNA (sense) sequence: the 70-nt PLP is
    5'-[mRNA nt 16-30][ID, 20 nt][anchor, 20 nt][mRNA nt 1-15]-3', and its 5'
    phosphate is added with T4 PNK. The gene-specific ID is read by bridge
    probes and fluorescent detection oligos (hybridization-based readout);
    the anchor is shared. Targets have a Tm of 65-75 C by the Tm formula of
    the HybISS design code; no other gene carries the 30-nt site, or the 20
    nt around the ligation junction alone; targets are 15 nt apart, 5 per
    gene. This is the HybISS design of Gyllborg et al. 2020, an evolution of
    the padlock ISS of Ke et al. 2013 (4-nt barcode read by sequencing by
    ligation).
  citations:
    - short: Gyllborg et al. 2020, Nucleic Acids Research (HybISS)
      title: >-
        Hybridization-based in situ sequencing (HybISS) for spatially resolved
        transcriptomics in human and mouse brain tissue
      doi: 10.1093/nar/gkaa792
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7641728/
    - short: Ke et al. 2013, Nature Methods
      title: In situ sequencing for RNA analysis in preserved tissue and cells
      doi: 10.1038/nmeth.2563
    - short: Moldia multi_padlock_design (padlock design code used by HybISS)
      title: Moldia/multi_padlock_design
      url: https://github.com/Moldia/multi_padlock_design
  parameter_sources:
    - parameter: extracts.target_region.source and transcripts
      value: mRNA of the MANE Select transcript, the Ensembl canonical one without it
      source: >-
        multi_padlock_design (readme.txt, lib/formatrefseq.py, lib/parmsa.py)
        designs on RefSeq NM and NR mRNAs, in the sequence common to all
        transcript variants. U-Probe has no shared-region option; the
        reference mRNA contains those regions. 59% of the HybISS mouse targets
        of Supplementary Table 1 that map to RefSeq mRNAs lie in 3' UTRs,
        including the Pvalb example below, which source CDS would miss.
      quote: run parallel multiple sequence alignment (ClustalW) to find common sequences of transcript variants
    - parameter: extracts.target_region.length (2 x 15-nt arms)
      value: 30
      source: Gyllborg 2020, Methods
      quote: arm length, 15; Tm, low 65, high 75; space between targets, 15 ... five targets were selected randomly per gene
    - parameter: post_process.filters.target_tm (with attributes.target_tm.tm_method and hybridization)
      value: >-
        65-75 C by the multi_padlock_design Tm formula at 75 mM monovalent,
        10 mM divalent salt, 100 nM probe, 20% formamide
      source: >-
        Gyllborg 2020, Methods (quoted above); formula and conditions from
        multi_padlock_design lib/screenseq.py (calculatetm: Sugimoto 1996
        nearest-neighbor parameters, + 16.6 log10([Na+] + 3.795 sqrt[Mg2+]),
        - 0.72 C per % formamide), which tm_method: multi_padlock_design
        reproduces to 1e-12 C. All 1,195 published targets of Supplementary
        Table 1 (mouse and human) lie within 65-75 C by this formula. Under
        U-Probe's default primer3 Tm and the same conditions only 327 (27%)
        do: primer3 gives 3.4 +- 1.5 C less (-3.2 to +7.5 C, more for AT-rich
        targets; correlation with GC -0.71), so no primer3 window is
        equivalent (the best 10-C one, 59.1-69.1 C, keeps 1,110).
      quote: Tm, low 65, high 75 (Gyllborg 2020); Tm -= 0.72 * 20  # formamide correction (lib/screenseq.py)
    - parameter: padlock template (arm order, ID and anchor)
      value: "target_region[15:30] + ID (20) + anchor (20) + target_region[0:15]"
      source: >-
        Gyllborg 2020, Methods and Supplementary Table 1 (e.g. Pvalb target
        CCCATCTCAGTCCTTCTCGCGGCCCTCCTG, PLP
        CTCGCGGCCCTCCTG|TAGACGTAGTGAGCATGACT|TCTACGAGTTTGCAGTCACG|CCCATCTCAGTCCTT);
        multi_padlock_design assembles probe[armlength:] + linker1 + barcode + linker2 + probe[0:armlength]
      quote: two 15 nt arms, and a backbone with a 20 nt ID sequence and a 20 nt anchor sequence, resulting in a final 70 nt long PLP
    - parameter: post_process.remove_overlap.location_interval
      value: 15
      source: Gyllborg 2020, Methods; gap in nt per multi_padlock_design lib/distributeprobes.py ("current -= armlength * 2 + interval")
      quote: space between targets, 15
    - parameter: post_process.equal_space.number_desired
      value: 5
      source: Gyllborg 2020, Methods
      quote: five targets were selected randomly per gene
    - parameter: post_process.filters.target_mapped_genes
      value: "<= 1, no other gene with a site within 2 substitutions of the 30-nt arm pair (Bowtie 1, exhaustive)"
      source: >-
        U-Probe approximation of the multi_padlock_design rule below (a hit
        of 30 nt with up to 2 substitutions meets it).
    - parameter: >-
        extracts.target_region.layout and post_process.filters.junction_mapped_genes
      value: >-
        <= 1, no other gene with a site within 1 substitution of target nt
        6-25, the 20 nt around the ligation junction (nt 15|16; Bowtie 1,
        exhaustive)
      source: >-
        multi_padlock_design lib/readblast.py: blastn (-word_size 7 -strand
        plus, RefSeq mRNAs, predicted XM/XR ignored) rejects a target when a
        hit in another gene is longer than one arm, more than 80% identical
        and starts at or before target nt 10 and ends at or after nt 21, i.e.
        covers the junction +-5 nt. The 20-nt search is U-Probe's judgement,
        not the repository's: a 20-nt hit with at most 1 substitution meets
        every condition, and by an estimate with blastn's default scoring
        (1/-2) on a database the size of the mouse RefSeq mRNAs it has an
        e-value below BLAST's default cutoff of 10, so the repository would
        reject it too (a 20-nt hit with 2 substitutions would not be
        reported). Shorter, gapped or more divergent hits that the repository
        also rejects are not searched. On the Ensembl 113 transcriptomes
        1,155 of the 1,195 published targets pass the 30-nt search and 1,138
        pass both; searching the 20 nt with 2 substitutions would leave 863.
      quote: >-
        it cannot have any sequence in the database with more than 50% of
        sequence coverage, covering ligation site +- 5 nucleotides, and 80% of
        homology (readme.txt)
  hybridization:
    source: >-
      Gyllborg 2020, Methods (10 nM per PLP, hybridized and ligated with Tth
      ligase and RNase H, 37 C for 30 min then 45 C for 1.5 h; HybISS
      protocols.io mix: Tth ligase buffer, 50 mM KCl, 20% formamide)
    notes: >-
      na_mM and mg_mM are the monovalent (K+/Na+) and divalent salt that
      multi_padlock_design assumes for its Tm window (0.1 uM probe, 75 mM
      monovalent, 10 mM divalent, 20% formamide); the buffer itself is not SSC.
  tm_window:
    applied: true
    value: [65, 75]
    target: target_region (the whole 30-nt arm pair)
    attribute: target_tm
    tm_method: multi_padlock_design
    conditions: {na_mM: 75, mg_mM: 10, probe_nM: 100, formamide_pct: 20, dntp_mM: 0}
    source: Gyllborg 2020, Methods; multi_padlock_design readme.txt and lib/screenseq.py
    note: >-
      Applied: attributes.target_tm computes the design code's own Tm
      (tm_method: multi_padlock_design) under these design conditions and
      post_process.filters.target_tm keeps 65-75 C, which all 1,195 published
      targets pass (primer3: 327). The published Pvalb target
      (Supplementary Table 1) computes to 70.5 C (primer3: 67.2 C).
  limitations:
    - Gyllborg 2020 picked 5 targets per gene at random; equal_space keeps 5 sites at least 15 nt apart, spread evenly along the RNA instead.
    - Specificity is searched with Bowtie 1 (the 30-nt site within 2 substitutions, the 20 nt around the junction within 1) against the transcriptome of the genome in use, not with the repository's BLAST rule against RefSeq mRNAs; see parameter_sources.
    - The padlock binds cDNA, so in situ reverse transcription is required; for direct RNA padlocks (e.g. SplintR ligase) the arms would be the reverse complements instead.
    - "TODO: verify GC criteria for HybISS padlock arms (none stated)."
  replace:
    - "genome: a genome name from your genomes.yaml (mm10 here); its align_index must include bowtie (Bowtie 1) for target_mapped_genes and junction_mapped_genes"
    - "targets: your gene names (Pvalb here)"
    - "encoding: per gene, the 20-nt ID (bridge-probe site); TAGACGTAGTGAGCATGACT is the published mouse Pvalb ID from Gyllborg 2020 Supplementary Table 1, an example only"

name: padlock_iss
description: HybISS padlock probes, 2 x 15-nt arms on cDNA with 20-nt ID and anchor (Gyllborg et al. 2020)

genome: mm10

targets:
  - Pvalb

encoding:
  Pvalb:
    ID: TAGACGTAGTGAGCATGACT

extracts:
  target_region:
    source: mRNA   # the whole mRNA, UTRs included
    transcripts: mane   # the MANE Select transcript (Ensembl canonical without one)
    length: 30
    step: 1
    # Only for the junction search below: nt 6-25 of the window, around the
    # ligation junction between nt 15 (arm_3 end) and 16 (arm_5 start).
    layout:
      template: "{arm_3_end}{junction}{arm_5_end}"
      parts:
        arm_3_end:
          length: 5
        junction:
          length: 20
        arm_5_end:
          length: 5

probes:
  padlock:
    template: "{arm_5}{id}TCTACGAGTTTGCAGTCACG{arm_3}"
    parts:
      arm_5:
        expr: "target_region[15:30]"
      id:
        expr: "encoding[target]['ID']"
      arm_3:
        expr: "target_region[0:15]"

# Hybridization conditions of the source protocol (sources: meta.hybridization).
# annealing_temperature and fold_score attributes are computed under them.
hybridization:
  temperature_c: 45
  na_mM: 75
  mg_mM: 10
  probe_nM: 10
  formamide_pct: 20
  dntp_mM: 0   # FISH buffers hold no dNTPs (unset, the legacy 0.6 mM would apply)

# Optional: genes not expressed in your sample are not counted as off-targets
# (they stay listed in target_mapped_genes_unexpressed). A single padlock makes
# signal after RCA, so keep target_mapped_genes <= 1: no expressed off-target
# per probe. Supply your own table:
# gene_expression:
#   table: expression.tsv   # a gene id or name column and a numeric column
#   value_column: TPM
#   min_value: 1

attributes:
  target_gc:
    target: target_region
    type: gc_content
  target_tm:
    target: target_region
    type: annealing_temperature
    # The formula and design conditions of the 65-75 C window (meta.tm_window);
    # primer3 would give 3.4 C less on average.
    tm_method: multi_padlock_design
    hybridization: {na_mM: 75, mg_mM: 10, probe_nM: 100, formamide_pct: 20, dntp_mM: 0}
  arm_5_tm:
    target: padlock.arm_5
    type: annealing_temperature
  arm_3_tm:
    target: padlock.arm_3
    type: annealing_temperature
  target_mapped_genes:
    target: target_region
    type: mapped_genes
    # The 30-nt site of both arms, which ligation needs. Bowtie 1 finds every
    # transcript site within 2 substitutions; it needs bowtie in the genome's
    # align_index. Bowtie2 (aligner: bowtie2, a local seed heuristic) flagged
    # only 87% of random 30-nt windows of human mRNAs that have such a site in
    # another gene (Ensembl 113 transcriptome).
    aligner: bowtie
    max_mismatches: 2
    strand: sense    # mRNA sites like target_region; the padlock binds their cDNA
  junction_mapped_genes:
    target: target_parts.junction
    type: mapped_genes
    # Ligation needs base-paired ends: another gene matching the 20 nt around
    # the junction (within 1 substitution) is rejected even when the rest of
    # the 30-nt site differs, as in the HybISS design code (meta.parameter_sources).
    aligner: bowtie
    max_mismatches: 1
    strand: sense

post_process:
  filters:
    target_tm:
      condition: target_tm >= 65 & target_tm <= 75
    target_mapped_genes:
      condition: target_mapped_genes <= 1
    junction_mapped_genes:
      condition: junction_mapped_genes <= 1
  sorts:
    is_ascending:
      - target_mapped_genes
      - junction_mapped_genes
  remove_overlap:
    location_interval: 15
  equal_space:
    number_desired: 5

summary:
  report_name: rna_report
  attributes:
    - target_gc
    - target_tm
    - arm_5_tm
    - arm_3_tm
    - target_mapped_genes
    - junction_mapped_genes
