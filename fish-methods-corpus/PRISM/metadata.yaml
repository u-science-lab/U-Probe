method:
  official_name: PRISM
  full_name: profiling of RNA in situ through single-round imaging
  aliases:
  - PRISM
classification:
  categories:
  - multiplex RNA FISH
  - padlock-probe imaging
  applications:
  - spatial RNA imaging
  - targeted spatial transcriptomics
  # Controlled two-level classification (corpus_schema.md "Method classification").
  probe_architecture: padlock
  readout_strategy:
  - fluorescent_barcode
  classification_evidence_status: reported
  classification_source: S01
  classification_notes: |
    RNA-targeted padlock with four physical barcode segments, circularized on RNA, RCA-amplified, and decoded in a single imaging round via intensity/color combinations of labeled and unlabeled imaging probes. No sequential base-by-base readout chemistry.
publication:
  original_year: 2025
  original_reference: S01
  doi: 10.1038/s41587-025-02883-7
  pmid: '41168495'
versions:
