# U-Probe protocol template: MiP-seq padlock probe + RCA initiator primer.
# Copy: `uprobe templates show mipseq -o protocol.yaml`, then replace
# everything under meta.replace. The workflow ignores the `meta` block.
meta:
  name: mipseq
  technology: MiP-seq (padlock + RCA initiator primer, pairwise sequencing)
  description: >-
    Two oligos bind a 40-nt RNA window: reading the RNA 5'->3', the padlock's
    5' arm site (13 nt), its 3' arm site (13 nt), one unbound nucleotide and the
    primer site (13 nt). The 58-nt padlock (5' phosphate added with T4 PNK) is
    5'-[rc of 5' arm site][CC][B1, 3 nt][TGCGTCTATTT][GT][B2, 3 nt]
    [TAGTGGAGCCT][rc of 3' arm site]-3'; SplintR ligase joins its ends on the
    RNA. The RCA initiator primer is 5'-[rc of primer site][spacer]
    [AGGCTCCACTA]-3' (25 nt): its 5' part binds the RNA next to the padlock
    and its 3' end binds the padlock's TAGTGGAGCCT, so Phi29 amplifies only
    circles that sit on the target together with the primer. The two barcodes
    B1 and B2 are read pairwise by sequencing by ligation from the
    TGCGTCTATTT and TAGTGGAGCCT anchor sites. Backbones are the published
    217-gene probe set, which has 2 sites per gene in an exon near the 5' end;
    the template keeps 2 sites within the first 1,000 nt of the RNA.
  citations:
    - short: Wu et al. 2024, Nature Biomedical Engineering
      title: Spatial multi-omics at subcellular resolution via high-throughput in situ pairwise sequencing
      doi: 10.1038/s41551-024-01205-7
    - short: Wu et al. 2023, bioRxiv (MiP-Seq preprint, Methods)
      title: Development of Multiomics in situ Pairwise Sequencing (MiP-Seq)
      doi: 10.1101/2023.01.07.523058
      url: https://www.biorxiv.org/content/10.1101/2023.01.07.523058v1
  parameter_sources:
    - parameter: extracts.target_region.source and transcripts
      value: mRNA of the MANE Select transcript, the Ensembl canonical one without it
      source: >-
        Preprint Methods (an exon near the 5' end; CDS and UTRs are not
        distinguished). Of the 217-gene set's padlock sites that map to mouse
        RefSeq mRNAs, 290 of 380 lie in the CDS and 64 in the 5' or 3' UTR;
        343 lie in every RefSeq variant of their gene.
      quote: Try to choose the exon close to the 5' end, and select 2 target sites for each gene
    - parameter: padlock arms (layout arm5_site, arm3_site)
      value: 13 nt each, adjacent on the RNA (no ligation gap)
      source: >-
        Preprint Methods (12-16 nt); 13 + 13 in 433/435 padlocks of the
        217-gene set (Nat Biomed Eng Supplementary Table, sheet "Fig 3")
      quote: Both ends of the padlock probe are complementary to the target sequence (12-16 bp)
    - parameter: padlock backbone
      value: "CC[B1]TGCGTCTATTTGT[B2]TAGTGGAGCCT"
      source: >-
        217-gene set, e.g. Th-1-PLP-1
        GGTGGATTTTGGC CC GAG TGCGTCTATTT GT CAT TAGTGGAGCCT CGGGTCTCTAAGT
      quote: each padlock probe contains two barcodes (B1 and B2)
    - parameter: primer orientation and padlock-binding tail
      value: "5' rc(primer site, 13 nt) ... AGGCTCCACTA 3' (rc of the padlock's TAGTGGAGCCT)"
      source: Preprint Methods; 217-gene set, e.g. Th-1-RCA-2 GCCTCTGGGCAGG C AGGCTCCACTA
      quote: The 5' end of the RCA initiator primer is complementary to the 3' end of the targeting sequence (12-16 bp), and the 3' end is complementary to the padlock probe
    - parameter: layout gap (1 nt), primer spacer (sense gap base) and primer length
      value: "primer = rc(primer_site) + gap base + AGGCTCCACTA = 25 nt"
      source: >-
        Derived from the published 217-gene sequences mapped to the mouse
        Ensembl 113 transcriptome (430 of 432 units; 367 on the canonical
        transcript): the primer site starts 1 nt after the 3' arm site in 417
        units, and the 25-nt primers (247 of 432, the majority) end the RNA
        part with the skipped (sense) base and then the tail, 234 of them
        exactly as written here. The 185 26-nt primers insert a C after that
        base (163) or use another 2-nt spacer; to build them instead, write
        the template as "{binding}{gap_base}CAGGCTCCACTA". The paper states
        12-16 nt for the RNA part and no spacer rule.
      quote: >-
        The 5' end of the RCA initiator primer is complementary to the 3' end
        of the targeting sequence (12-16 bp), and the 3' end is complementary
        to the padlock probe (Wu 2023 Methods)
    - parameter: attributes.target_mapped_genes.oligos
      value: "[[arm5_site, arm3_site], primer_site]: the padlock's 26-nt site and the primer's 13-nt site searched on their own, within 2 substitutions each; a gene counts when both have a site on one of its transcripts"
      source: >-
        Wu 2023 Methods: the RCA initiator primer binds the RNA next to the
        padlock and the padlock itself, so Phi29 amplifies a circle only where
        both oligos sit on one RNA. The off-target to avoid is a transcript
        both oligos bind, each within the mismatch limit; the paper's own
        specificity criteria are not stated (meta.limitations).
    - parameter: post_process.filters.near_5p (target_start) and post_process.equal_space
      value: "2 sites per gene, starting within the first 1,000 nt of the RNA"
      source: >-
        Preprint Methods (2 sites per gene, in an exon close to the 5' end;
        the paper gives no distance). The 1,000-nt cap is U-Probe's reading of
        "close to the 5' end": of the 367 published sites that map to the
        mouse canonical transcript, the median starts at nt 885 (quartiles
        455 and 1,650) and 54% start within 1,000 nt, 71% within 1,500; both
        sites of 88 of the 202 genes (44%) and at least one site of 128 (63%)
        start within 1,000. Raise or drop the filter for long transcripts (a
        target with no passing window below the cap gets no probes and the run
        is `partial`); Supplementary Fig. 7 shows 8 pairs per gene detecting
        more, which needs number_desired: 8 and usually a larger cap.
      quote: Try to choose the exon close to the 5' end, and select 2 target sites for each gene
    - parameter: post_process.filters.arm_5_tm, filters.arm_3_tm and filters.primer_tm
      value: ">= 28 C for both 13-nt arms and the 13-nt primer site, under the hybridization block (2x SSC, 10% formamide, 30 nM)"
      source: >-
        The published 217-gene set (Nat Biomed Eng Supplementary Table,
        sheet "Fig 3"; 434 units). Under these conditions its arms and primer
        sites have a Tm of 25.1-49.6 C (median 39.6); 21% of each lie below
        the 37 C hybridization, so the units bind as a whole (26-nt padlock
        duplex plus primer) rather than part by part, and the floor follows
        the low tail of the published parts instead of the hybridization
        temperature: 28 C is the 2.5th percentile of each unit's weakest
        part and rejects 9 of the 434 units (2%). The paper states no Tm
        criterion.
  hybridization:
    ssc: 2x
    source: >-
      MiP-Seq preprint Methods (padlock probes 30 nM/probe and equimolar RCA
      initiator in 2X SSC, 10% formamide, 20 mM RVC, overnight at 37 C)
    notes: >-
      [Na+] computed from 2x SSC (0.3 M NaCl + 0.03 M trisodium citrate).
      Ligation: SplintR ligase 1 U/uL, 37 C for 2 h; RCA: Phi29, 30 C for 2 h.
  limitations:
    - MiP-seq selects 2 target sites per gene in an exon close to the 5' end. U-Probe has no "near the 5' end" option, so the template filters target_start (the window's position along the RNA, 1-based) and then spreads the 2 sites evenly over what is left; the cap of 1,000 nt is U-Probe's, not the paper's (see parameter_sources).
    - The published primers are 25 nt (247 of 432) or 26 nt (185); the template builds the 25-nt majority form, and the 26-nt one differs by one C (see parameter_sources).
    - "TODO: verify Tm/GC/specificity criteria; the paper used a self-developed probe searching program and states none, so only the U-Probe specificity approximation (mapped_genes <= 1) and a Tm floor taken from the published units (parameter_sources) are applied."
  replace:
    - "genome: a genome name from your genomes.yaml (mm10 here); its align_index must include bowtie (Bowtie 1) for target_mapped_genes"
    - "targets: your gene names (Th here)"
    - "encoding: per gene, the 3-nt barcodes B1 and B2 (GAG/CAT are from the published Th-1-PLP-1, an example only)"

name: mipseq
description: MiP-seq padlock with two 3-nt barcodes and RCA initiator primer on a 40-nt window (Wu et al. 2024)

genome: mm10

targets:
  - Th

encoding:
  Th:
    B1: GAG
    B2: CAT

extracts:
  target_region:
    source: mRNA   # the whole mRNA; target_start counts from its 5' end
    transcripts: mane   # the MANE Select transcript (Ensembl canonical without one)
    length: 40
    step: 1
    layout:
      template: "{arm5_site}{arm3_site}{gap}{primer_site}"
      parts:
        arm5_site:
          length: 13
        arm3_site:
          length: 13
        gap:
          length: 1
        primer_site:
          length: 13

probes:
  padlock:
    template: "{arm_5}CC{b1}TGCGTCTATTTGT{b2}TAGTGGAGCCT{arm_3}"
    parts:
      arm_5:
        expr: "rc(target_parts['arm5_site'])"
      b1:
        expr: "encoding[target]['B1']"
      b2:
        expr: "encoding[target]['B2']"
      arm_3:
        expr: "rc(target_parts['arm3_site'])"
  rca_primer:
    # 13 + 1 + 11 = 25 nt, the majority of the published primers; the 26-nt
    # ones add a C before the tail: "{binding}{gap_base}CAGGCTCCACTA".
    template: "{binding}{gap_base}AGGCTCCACTA"
    parts:
      binding:
        expr: "rc(target_parts['primer_site'])"
      gap_base:
        expr: "target_parts['gap']"

# Hybridization conditions of the source protocol (sources: meta.hybridization).
# annealing_temperature and fold_score attributes are computed under them.
hybridization:
  temperature_c: 37
  na_mM: 390
  probe_nM: 30
  formamide_pct: 10
  dntp_mM: 0   # FISH buffers hold no dNTPs (unset, the legacy 0.6 mM would apply)

attributes:
  target_gc:
    target: target_region
    type: gc_content
  arm_5_tm:
    target: padlock.arm_5
    type: annealing_temperature
  arm_3_tm:
    target: padlock.arm_3
    type: annealing_temperature
  primer_tm:
    target: rca_primer.binding
    type: annealing_temperature
  target_mapped_genes:
    target: target_region
    type: mapped_genes
    # Phi29 amplifies only circles that sit on the RNA together with the RCA
    # primer, so the padlock's 26-nt site (both arms) and the primer's 13-nt
    # site are searched on their own with Bowtie 1, every site within 2
    # substitutions, and an off-target gene counts when both have a site on
    # one of its transcripts. Needs bowtie in the genome's align_index.
    aligner: bowtie
    max_mismatches: 2   # per oligo
    strand: sense   # sites where target_region occurs, which the probes bind
    oligos: [[arm5_site, arm3_site], primer_site]   # padlock, RCA primer

post_process:
  filters:
    target_mapped_genes:
      condition: target_mapped_genes <= 1
    # "An exon close to the 5' end": windows starting in the first 1,000 nt of
    # the RNA (meta.parameter_sources). Raise the cap when a long transcript
    # gives too few sites.
    near_5p:
      condition: target_start <= 1000
    # Tm floor of the arms and the primer site: the low tail of the published
    # units (meta.parameter_sources; it rejects 2% of them).
    arm_5_tm:
      condition: arm_5_tm >= 28
    arm_3_tm:
      condition: arm_3_tm >= 28
    primer_tm:
      condition: primer_tm >= 28
  sorts:
    is_ascending:
      - target_mapped_genes
  remove_overlap:
    location_interval: 0
  equal_space:
    number_desired: 2   # 2 sites per gene (8 raised detection in Supp. Fig. 7)

summary:
  report_name: rna_report
  attributes:
    - target_gc
    - arm_5_tm
    - arm_3_tm
    - primer_tm
    - target_mapped_genes
