  design_wall_seconds_including_resource_restarts: 3356.251808643341
  evaluation_workers: 16
  evaluation_wall_seconds: 450.3818364031613
  events:
  - Initial eight-worker run; resumed with sixteen workers. The effective user cgroup
    limit was 64 GiB and fifteen workers were OOM-killed; 49 complete gene outputs
    were retained.
  - Execution v2 used bounded 250-window native layout batches and ProcessPoolExecutor,
    retaining unchanged design parameters; resumed with eight workers.
  - The last gene, Pcdh9, retained all isoforms including the 148183-nt XR_003950833.2
    transcript. It was recomputed using sixteen ordered construction-batch workers
    after retaining 63 complete genes. Truncated diagnostic snapshots were not evaluated.
  - Npy emitted CSV records were byte-identical after decompression across execution
    v1, v2 and v3.
  - Closed per-gene outputs were merged without changing CSV body bytes using pigz
    with sixteen threads; all gzip streams passed EOF/CRC checks.
  - All 88542552 records were evaluated; an independent complete rescan reproduced
    every sequence/pair match and all metrics.
