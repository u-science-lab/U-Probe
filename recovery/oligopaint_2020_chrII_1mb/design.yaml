extracts:
  target_region:
    source: genome
    length: 40
    step: 1
    masked: keep
probes:
  forward:
    template: '{index5}{fiducial}{barcode}{binding}{index3}'
    parts:
      index5:
        expr: encoding[target]['index5']
      fiducial:
        expr: encoding[target]['fiducial']
      barcode:
        expr: encoding[target]['barcode']
      binding:
        expr: target_region
      index3:
        expr: encoding[target]['index3']
  reverse:
    template: '{index5}{fiducial}{barcode}{binding}{index3}'
    parts:
      index5:
        expr: encoding[target]['index5']
      fiducial:
        expr: encoding[target]['fiducial']
      barcode:
        expr: encoding[target]['barcode']
      binding:
        expr: rc(target_region)
      index3:
        expr: encoding[target]['index3']
hybridization:
  na_mM: 50
  mg_mM: 0
  dntp_mM: 0.6
  probe_nM: 50
  formamide_pct: 0
attributes:
  gc:
    type: gc_content
    target: binding
  tm:
    type: annealing_temperature
    target: binding
    tm_method: primer3
post_process:
  filters:
    unique_exact:
      condition: exact_sites == 1
    gc_range:
      condition: gc >= 0.30 & gc <= 0.70
  remove_overlap:
    location_interval: 0
