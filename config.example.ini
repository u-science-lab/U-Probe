# Optional local HTTP-server configuration.
# Copy this file to config.ini and edit locally. config.ini is ignored by Git.
# The application reads config.ini; it does not automatically read this example.
# Without overrides, runtime directories are relative to the server root.
# UPROBE_SERVER_ROOT may override that root through the local environment.
# Explicit relative path overrides below resolve from the process working directory.

[Paths]
# Leave commented to use the application's portable defaults.
# data_dir = ./data
# genomes_dir = ./data/genomes
# results_dir = ./data/results

[TaskQueue]
task_threads = 1
max_concurrent_tasks = 2

[Server]
app_env = development
host = localhost
port = 8000
workers = 1
frontend_url = http://localhost:5173

# Supply credentials through private environment variables, never this file.
