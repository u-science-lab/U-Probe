# U-Probe protocol template: Oligopaint DNA FISH with OligoMiner-style homology regions.
# Copy: `uprobe templates show oligopaint -o protocol.yaml`, then replace
# everything under meta.replace. The workflow ignores the `meta` block.
meta:
  name: oligopaint
  technology: Oligopaint / OligoMiner DNA FISH
  description: >-
    Each library oligo is 5'-[primer 1, 21 nt][genomic homology, 35-41 nt]
    [primer 2 site, 21 nt]-3'. Homology regions tile a genomic interval
    without overlap and are taken from the + strand (both strands of the
    denatured DNA are targets). As in OligoMiner, they are mined from a
    repeat-masked genome: windows with a soft-masked (lowercase) or N base
    are skipped. The homology settings are OligoMiner's "Balance" preset as
    in its genome-wide hg38 set (35-41 nt, Tm 42-47 C by OligoMiner's own Tm
    formula under 390 mM Na+, 25 nM probe and 50% formamide, GC 20-80%, no
    AAAAA/TTTTT/CCCCC/GGGGG or N), followed by OligoMiner's specificity
    checks: a unique Bowtie2 alignment (outputClean Unique Mode) and the
    18-mer k-mer filter, which counts each k-mer on the genome's forward
    strand (only the k-mers of the locus' candidates are counted, in one
    pass over the genome, instead of building a genome-wide table). The
    flanking 21-nt primers follow the original Oligopaint library format (32 nt of genomic sequence flanked by 21-nt
    primers); after amplification one primer carries the fluorophore and the
    other a nicking site, so the final probe is the labelled primer plus the
    homology region. The primers here are N placeholders that you must
    replace with a real primer pair (meta.replace).
  citations:
    - short: Beliveau et al. 2018, PNAS
      title: >-
        OligoMiner provides a rapid, flexible environment for the design of
        genome-scale oligonucleotide in situ hybridization probes
      doi: 10.1073/pnas.1714530115
      url: https://europepmc.org/article/PMC/PMC5877937
    - short: Beliveau et al. 2012, PNAS
      title: Versatile design and synthesis platform for visualizing genomes with Oligopaint FISH probes
      doi: 10.1073/pnas.1213818110
    - short: OligoMiner source code (blockParse.py, probeTm.py, outputClean.py, kmerFilter.py)
      title: beliveau-lab/OligoMiner
      url: https://github.com/beliveau-lab/OligoMiner
    - short: Marcais and Kingsford 2011, Bioinformatics (Jellyfish)
      title: A fast, lock-free approach for efficient parallel counting of occurrences of k-mers
      doi: 10.1093/bioinformatics/btr011
  parameter_sources:
    - parameter: extracts.target_region.masked
      value: drop (needs a soft-masked FASTA, e.g. Ensembl dna_sm or UCSC hg38.fa)
      source: >-
        Beliveau 2018 Methods (Whole-Genome Probe Discovery; assemblies
        downloaded "with and without repeat masking" from UCSC); OligoMiner
        README; blockParse.py rejects every window with an N base, so
        hard-masked (RepeatMasker) repeats yield no candidate
      quote: >-
        Genome assemblies in FASTA format without repeat masking were used to
        build Bowtie2 alignment indices and Jellyfish files. Repeat-masked
        input files were used for probe discovery.
    - parameter: extracts.target_region.length
      value: [35, 41]
      source: >-
        OligoMiner's genome-wide hg38 "Balance" probe set (hg38b.tar.gz, the
        set PaintSHOP serves; its probes are 35-41 nt, 35 the most common
        length), Beliveau 2018 Results and Hershberg 2021 Table 1. Beliveau
        2018 Fig. 2A, Table S1 (the imaged 19p13.2 and Xist sets) and the
        blockParse.py default (-l 36 -L 41) give 36-41 instead.
      quote: a "balance" set that seeks to compromise between coverage and binding affinity (35-41 nt, 42 C hybridization; Fig. 2A)
    - parameter: post_process.filters.homology_gc
      value: 0.20-0.80
      source: OligoMiner blockParse.py -g/-G defaults
      quote: minimum allowed percent G + C, default is 20 ... default is 80
    - parameter: post_process.filters.homology_tm (with attributes.homology_tm.tm_method and hybridization)
      value: >-
        42-47 C at 390 mM Na+, 50% formamide, 25 nM probe, computed with
        OligoMiner's formula (tm_method: oligominer)
      source: >-
        OligoMiner blockParse.py -t/-T, -s, -F and -c/-C defaults (see
        meta.tm_window) and probeTm.py: Biopython Tm_NN with the DNA_NN3
        table, salt correction 5, strand concentration dnac1 - dnac2/2,
        rounded to 2 decimals, minus 0.65 C per % formamide. The window is
        defined under this formula; Primer3 (SantaLucia 1998, Blake-Delcourt
        formamide) reads about 1.5 C lower for these windows. On
        chr19:10,000,001-10,200,000 (hg38) the Primer3 window gave 1,486
        probes, 473 of them above 47 C by this formula; this one gives 1,479.
      quote: The minimum allowed Tm, default is 42 ... The maximum allowed Tm, default is 47
    - parameter: post_process.filters.homopolymers
      value: AAAAA, TTTTT, CCCCC, GGGGG excluded
      source: OligoMiner blockParse.py -X default
      quote: default is 'AAAAA,TTTTT,CCCCC,GGGGG'
    - parameter: post_process.filters.n_bases
      value: N excluded
      source: >-
        OligoMiner blockParse.py (Ncheckopt rejects every window with an N,
        whatever -X lists); Beliveau 2018 Results
      quote: screens for prohibited sequences such as homopolymeric runs and "N" bases
    - parameter: attributes.homology_sites and post_process.filters.homology_sites_num
      value: exactly 1 Bowtie2 alignment (--very-sensitive-local, both strands)
      source: >-
        Beliveau 2018 Methods (Unique Mode, UM); OligoMiner README (UM
        alignment with -k 100, as mapped_sites runs it); outputClean.py -u
        keeps a probe that aligned and has no XS:i tag, i.e. for which Bowtie2
        found no second alignment
      quote: Bowtie2 was run with "--very-sensitive-local -k 2 -t" in UM
    - parameter: post_process.remove_overlap.location_interval
      value: 0
      source: OligoMiner blockParse.py -S default
      quote: The minimum spacing between adjacent probes, default is 0 bases
    - parameter: post_process.filters.homology_kmer_count (kmer_len 18, max count <= 4)
      value: 18-mers; drop a probe if any 18-mer occurs >= 5 times
      source: >-
        OligoMiner kmerFilter.py (-m 18; drops a probe when a k-mer count is
        >= -k) and Beliveau 2018 genome-wide runs (-k 5)
      quote: Filter probes with kmers occurring => than this many times
    - parameter: attributes.homology_kmer_count.locus_only
      value: true (count only the 18-mers of the candidate windows, both strands listed, in one pass over the genome FASTA)
      source: >-
        Jellyfish 2 count --if (Marcais and Kingsford 2011; `jellyfish count
        --help`: "Count only k-mers in this files"). The counts of the listed
        k-mers equal those of a genome-wide dictionary (OligoMiner's
        `jellyfish count -s 3300M -m 18 ...` over hg38), so the k <= 4
        filter is unchanged (on the 50-kb example locus the final table was
        identical to one made with a table of the locus' k-mers); the
        temporary index is MB-sized and not kept, and no genome-wide table is
        built for a locus design.
    - parameter: attributes.homology_kmer_count.strand
      value: sense (the probe's k-mers as written, counted on the FASTA's forward strand)
      source: >-
        Beliveau 2018 Methods: the 18-mer dictionary was built without -C
        (canonical counting), so jellyfish counts each k-mer on the forward
        strand only; PaintSHOP builds its dictionary the same way (Snakefile,
        rule build_jellyfish). The -k 5 threshold was set on these counts.
      quote: jellyfish count -s 3300M -m 18 -o hg38_18.jf --out-counter-len 1 -L 2 hg38.fa
    - parameter: oligopaint_oligo primers
      value: 21 nt on each side of the homology region (N placeholders)
      source: Beliveau 2012; Beliveau 2018 Table S2 lists its primer pairs (20-22 nt)
      quote: each oligo contains 32 bases of genomic sequence flanked by 21-base primer sequences
  hybridization:
    ssc: 2x (2x SSCT)
    source: >-
      Beliveau 2018 Fig. 2A "Balance" preset (42 C hybridization) and
      blockParse.py defaults (-s 390 mM Na+, -F 50% formamide); buffer 2x
      SSCT, 50% formamide, 10% dextran sulfate (Beliveau 2012, 2018)
    notes: >-
      Genomic DNA is denatured before hybridization (Beliveau 2012: 92 C for
      2.5 min; Beliveau 2018 3D DNA FISH: 78 C for 3 min, then >24 h at
      47-52 C with the stringent settings).
  tm_window:
    applied: true
    value: [42, 47]
    target: oligopaint_oligo.homology
    attribute: homology_tm
    conditions: {na_mM: 390, formamide_pct: 50, probe_nM: 25, method: "tm_method oligominer: Biopython Tm_NN, DNA_NN3, saltcorr 5, 0.65 C per % formamide"}
    source: OligoMiner blockParse.py -t/-T defaults ("The minimum allowed Tm, default is 42" / "default is 47")
    note: >-
      Applied: attributes.homology_tm computes OligoMiner's Tm (tm_method:
      oligominer) under these design conditions and
      post_process.filters.homology_tm keeps 42-47 C.
  limitations:
    - "OligoMiner's outputClean LDA Mode (each Bowtie2 alignment scored with an LDA model of duplex stability; used for the 19p13.2 sets of Beliveau 2018 Table S1) is not reproduced. The template applies Unique Mode instead: it drops a probe with any second alignment, however weak."
    - "No secondary-structure filter: Beliveau 2018 applied none to its probe sets (Methods; Table S1). OligoMiner's optional structureCheck.py (NUPACK dna1998; keeps probes whose unstructured state has probability > 0.1 at 47 C + 0.65 C per % formamide) has no U-Probe equivalent: fold_score is a ViennaRNA RNA MFE."
    - "kmer_count with locus_only reads the whole genome FASTA once per run (a temporary index of the candidates' k-mers, not kept). For many runs over the same genome, or a whole-chromosome paint, a genome-wide table built once (locus_only: false and jellyfish: true in the genome entry) can be cheaper; the counts are the same."
    - "No primer sequences are given: primer_1 and primer_2_rc are 21-N placeholders, and a library ordered with them cannot be amplified (meta.replace says what to supply)."
  replace:
    - "genome: a genome name from your genomes.yaml (hg38 here) whose FASTA is soft-masked (repeats in lowercase): `uprobe genome fetch --species homo_sapiens --soft-masked`, or UCSC hg38.fa. With an unmasked FASTA, give the repeats as extracts.target_region.mask (a RepeatMasker BED of the same assembly and chromosome names, e.g. UCSC rmsk intervals); otherwise masked: drop skips no repeat (uprobe validate --check-targets and the run log warn). The entry must list bowtie2 in align_index for mapped_sites (the genome-wide index is built by `uprobe build-index`). kmer_count uses locus_only, so `jellyfish: true` is not needed, only Jellyfish 2 (`jellyfish count --if`) on PATH"
    - "targets: genomic intervals chrom:start-end in your FASTA's naming (a 50-kb example interval here)"
    - "oligopaint_oligo.primer_1 and primer_2_rc: replace both 21-N placeholders with a real primer pair. primer_1 is the forward PCR primer, 5'->3' as you order it; primer_2_rc is the reverse complement of the reverse PCR primer (the library oligo carries its binding site). Each primer 20-22 nt (21 in Beliveau 2012; 20-22 in Beliveau 2018 Table S2), with similar Tm; neither may occur in the target genome or pair with the other or with the homologies. Use one pair per pool or sub-pool, e.g. a published set designed to be orthogonal to the genome (PaintSHOP, Hershberg 2021) or a pair from Beliveau 2018 Table S2. Sequences that are not part of the library oligo go on the ordered primers: the dye, a nicking site, or a T7 promoter tail (TAATACGACTCACTATAGGG) for in vitro transcription. Readout or secondary-oligo sites for indirect labelling are extra parts of oligopaint_oligo."

name: oligopaint
description: Oligopaint DNA FISH library oligos with OligoMiner Balance homology regions (Beliveau et al. 2012, 2018)

genome: hg38

targets:
  - chr19:10000001-10050000

encoding:
  chr19:10000001-10050000: {}

extracts:
  target_region:
    source: genome
    length: [35, 41]
    step: 1
    # Skip windows with a soft-masked (lowercase) or N base: OligoMiner mines
    # repeat-masked FASTA (meta.parameter_sources). Needs a soft-masked genome,
    # or an unmasked one plus `mask: <RepeatMasker BED>` (meta.replace).
    masked: drop

probes:
  oligopaint_oligo:
    template: "{primer_1}{homology}{primer_2_rc}"
    parts:
      # PLACEHOLDERS: replace both N runs before ordering (meta.replace).
      primer_1:
        # Your forward PCR primer, 5'->3' as ordered (20-22 nt).
        template: "NNNNNNNNNNNNNNNNNNNNN"
        parts: {}
      homology:
        expr: "target_region"
      primer_2_rc:
        # The reverse complement of your reverse PCR primer (20-22 nt).
        template: "NNNNNNNNNNNNNNNNNNNNN"
        parts: {}

# Hybridization conditions of the source protocol (sources: meta.hybridization).
# annealing_temperature and fold_score attributes are computed under them.
hybridization:
  temperature_c: 42
  na_mM: 390
  formamide_pct: 50
  dntp_mM: 0   # FISH buffers hold no dNTPs (unset, the legacy 0.6 mM would apply)

attributes:
  homology_gc:
    target: oligopaint_oligo.homology
    type: gc_content
  homology_tm:
    target: oligopaint_oligo.homology
    type: annealing_temperature
    # OligoMiner's Tm formula and the design conditions of its 42-47 C window (meta.tm_window).
    tm_method: oligominer
    hybridization: {na_mM: 390, formamide_pct: 50, probe_nM: 25}
  homology_kmer_count:
    target: oligopaint_oligo.homology
    type: kmer_count
    kmer_len: 18
    aligner: jellyfish
    # OligoMiner's dictionary counts k-mers on the forward strand only (no -C);
    # its <= 4 threshold refers to these counts (meta.parameter_sources).
    strand: sense
    # Count only the candidates' k-mers, in one pass over the genome FASTA:
    # the same counts as a genome-wide table, without building one.
    locus_only: true
  homology_sites:
    # Genome alignments, Bowtie2 --very-sensitive-local -k 100 on both strands:
    # OligoMiner's Unique Mode alignment. homology_sites_num counts them.
    target: oligopaint_oligo.homology
    type: mapped_sites
    aligner: bowtie2

post_process:
  filters:
    homology_gc:
      condition: homology_gc >= 0.2 & homology_gc <= 0.8
    homology_tm:
      condition: homology_tm >= 42 & homology_tm <= 47
    homopolymers:
      type: sequence_pattern
      target: oligopaint_oligo.homology
      exclude_patterns: [AAAAA, TTTTT, CCCCC, GGGGG]
    n_bases:
      type: sequence_pattern
      target: oligopaint_oligo.homology
      exclude_patterns: [N]
    homology_kmer_count:
      condition: homology_kmer_count <= 4
    # outputClean Unique Mode: Bowtie2 finds the probe's own site and no other.
    homology_sites_num:
      condition: homology_sites_num == 1
  sorts:
    is_ascending:
      - homology_kmer_count
  remove_overlap:
    location_interval: 0

summary:
  report_name: dna_report
  attributes:
    - homology_gc
    - homology_tm
    - homology_kmer_count
