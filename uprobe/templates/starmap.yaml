# U-Probe protocol template: STARmap SNAIL probes (padlock + primer).
# Copy: `uprobe templates show starmap -o protocol.yaml`, then replace
# everything under meta.replace. The workflow ignores the `meta` block.
meta:
  name: starmap
  technology: STARmap SNAIL (padlock + primer pair)
  description: >-
    SNAIL (specific amplification of nucleic acids via intramolecular
    ligation) uses two oligos on a 40-46-nt RNA region split into two 19-25-nt
    sites with a gap of 1-2 nt (the paper allows 0, no published pair uses
    it). Reading the RNA 5'->3', the padlock binds the
    upstream site and the primer the downstream site. The primer's 12-nt tail
    pairs 6 nt with each end of the padlock, so the padlock can be circularized
    by ligation and rolling-circle-amplified only when both oligos hybridize to
    the same RNA molecule. The padlock (5' phosphate) is
    5'-[A][code][TA][rc of padlock site][AATTATTAC][code][CATACACTAAAGATA]-3' and
    the primer is 5'-[rc of primer site][TA][rc(code)][T][TATCTT]-3', where
    code is the gene barcode read by SEDAL sequencing. The backbone sequences
    are those of the published STARmap PLUS 64-gene probe set (Zeng et al.
    2023), which uses the 6 + 6 primer/padlock split of Wang et al. 2018.
  citations:
    - short: Wang et al. 2018, Science
      title: Three-dimensional intact-tissue sequencing of single-cell transcriptional states
      doi: 10.1126/science.aat5691
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6339868/
    - short: Zeng et al. 2023, Nature Neuroscience (STARmap PLUS)
      title: >-
        Integrative in situ mapping of single-cell transcriptional states and
        tissue histopathology in a mouse model of Alzheimer's disease
      doi: 10.1038/s41593-022-01251-x
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11332722/
  parameter_sources:
    - parameter: extracts.target_region.length and layout
      value: "40-46 nt = padlock site 19-25 + gap 1-2 + primer site 19-25"
      source: >-
        Wang 2018, Supplementary Materials (probe design) and Fig. S1A legend.
        The gap excludes 0, which the text allows but no published pair uses:
        of the 4,222 pairs of the 2018 (36 sampled), 64-gene, 2,766-gene
        (36 sampled) and Shi 2023 1,022-gene sets, the 4,178 whose two sites
        were located on a mouse Ensembl 113 transcript are 1 nt apart (1,286)
        or 2 nt apart (2,892). Abutting sites would also leave the ligated
        ends of the padlock and the primer's 3' end with no room between the
        two duplexes. The lengths vary site by site: in the 9,910 published
        pairs of these sets (full 64- and 2,766-gene sets) each site has
        19-25 nt (19-21 in 69%), the window 40-46 nt (40 in 18%, 46 in
        25%) and the gap 2 nt in 72%, chosen so that the halves' Tm match.
      quote: >-
        with length restriction of 40-46 nucleotide ... split into halves of
        20-25 nt, with an 0-2 nt gap in between ... each primer or padlock probe
        has 19-25 nt (the paper gives 20-25 in the methods text and 19-25 in
        Fig. S1A)
    - parameter: extracts.target_region.source and transcripts
      value: CDS of the MANE Select transcript, the Ensembl canonical one without it
      source: >-
        Wang 2018, Supplementary Materials. U-Probe has no shortest-isoform
        option; one reference transcript's CDS is the closest choice, and never
        adds exons of other isoforms.
      quote: only the shortest isoforms were considered and the coding regions were used
    - parameter: primer tail / padlock ends
      value: 6 nt on each padlock end (12-nt primer tail)
      source: Wang 2018, Fig. S1A legend
      quote: the complementary sequence between the primer and padlock is only 6 nt on each arm ... with Tm below room temperature
    - parameter: padlock and primer backbones
      value: "padlock /5Phos/A[code]TA-[site]-AATTATTAC[code]CATACACTAAAGATA; primer [site]-TA[rc code]TTATCTT"
      source: >-
        Zeng 2023, Supplementary Table 1 (64-gene set), e.g. ALDOC_01
        /5Phos/AAAATAACGAGAATGCCCTTATCCTGGAATTATTACAAACATACACTAAAGATA and
        ALDOC_11 ACCCTTGTCAACCTTGATGCTATTTTTATCTT; positions on the RNA
        (padlock upstream, primer downstream) checked against RefSeq mRNAs
    - parameter: post_process.filters.target_mapped_genes
      value: "<= 1"
      source: U-Probe approximation of target specificity; Wang 2018 names Picky 2.2 without further criteria.
    - parameter: post_process.filters.padlock_tm and primer_tm, attributes.tm_balance, remove_overlap.prefer
      value: "both halves 50-65 C under the hybridization block; at each start the layout with the smallest |padlock_tm - primer_tm|"
      source: >-
        Wang 2018 (Fig. S1A) splits each region into halves of a designed
        Tm of 60 C with the best Tm match (Picky 2.2), under conditions it
        does not state. Under this template's conditions (2x SSC, 10%
        formamide, 100 nM) the 19,820 halves of the 9,910 published pairs
        have 58.0 C (median; 5th-95th percentile 53.5-63.3) and the two
        halves of a pair differ by 0.9 C (median; 90th percentile 2.5).
        Both halves of 96.8% of the pairs lie within 50-65 C. Without a
        preference remove_overlap kept the shortest layout at each start,
        so every unit was 19 + 1 + 20 nt.
      quote: The two probes were designed with a designed Tm of 60oC (Wang 2018, Fig. S1A legend, paraphrased)
  hybridization:
    ssc: 2x
    source: >-
      Wang 2018, Supplementary Materials (2X SSC, 10% formamide, 1% Tween-20,
      20 mM RVC, salmon sperm DNA, SNAIL probes at 100 nM per oligo, 40 C
      overnight); STARmap PLUS used 1 nM per oligo for 36 h
    notes: >-
      [Na+] computed from 2x SSC (0.3 M NaCl + 0.03 M trisodium citrate).
      Ligation: T4 DNA ligase at room temperature for 2 h. probe_nM is the
      100 nM of Wang 2018, although the backbone is the PLUS 64-gene one:
      the protocols disagree (100 nM overnight in Wang 2018, 1 nM for 36 h in
      STARmap PLUS, 5 nM for 24-36 h in Shi 2023), and only Tm is affected.
      On the 8,444 published halves U-Probe's Tm is 6.4 C lower at 1 nM and
      4.2 C lower at 5 nM than at 100 nM (medians 51.6, 53.8 and 58.0 C);
      set probe_nM to the concentration you will hybridize at.
  tm_window:
    applied: false
    value: 60
    target: padlock.binding and primer.binding
    conditions: "unknown (Picky 2.2 defaults; TODO: verify)"
    source: Wang 2018, Fig. S1A legend ("with a designed Tm of 60oC"); halves are chosen with the best Tm match
    note: >-
      The design conditions are not stated, so the 60 C target is recorded
      and not used. Both half Tms are computed under the hybridization
      block's conditions (2x SSC, 10% formamide, 100 nM), under which the
      19,820 halves of the 9,910 published pairs (2018 sample, full 64- and
      2,766-gene sets, Shi 2023) have a median Tm of 58.0 C (5th-95th
      percentile 53.5-63.3, min 45.2, max 71.9). The template keeps halves
      within 50-65 C, where both halves of 96.8% of the published pairs lie,
      and at each start the layout whose halves match best (tm_balance), as
      Picky did; the published halves differ by a median of 0.9 C.
  limitations:
    - Wang 2018 designed 4 probe pairs per gene (STARmap PLUS 2 or 4); equal_space keeps 4 pairs, spread evenly along the RNA.
    - Picky 2.2 picks the split with the best Tm match between the halves around a designed 60 C. The template enumerates every split of 19-25 + 1-2 + 19-25 nt, keeps halves of 50-65 C under its own conditions and, at each start, the split with the smallest Tm difference (tm_balance, remove_overlap.prefer); it does not aim at a Tm value within the window.
    - The 3-nt code of this backbone is read in 4 SEDAL rounds and caps the panel at 64 genes (4^3; the published 64-gene set uses every code, AAA included). Larger panels need another backbone: the 1,022-gene one (5-nt code read in 6 rounds plus a separate 3-nt splint code) or the 2,766-gene one (two 3-nt blocks, 8 + 6 splint, 8 rounds).
    - The same 3-nt code is the splint here, as in the 1,022- and 2,766-gene sets, so each gene's primer circularizes only its own padlock. Wang 2018 used one splint for every gene (padlock 5' ACATTA, primer tail TAATGT TATCTT), where the primer of one gene can circularize the padlock of another on a neighbouring molecule and give a wrong code.
    - "TODO: verify the minimum spacing between probe pairs; regions are only required not to overlap here."
    - "TODO: verify the 2018 backbone (Table S1 was not accessible); Wang 2018 used a 5-nt barcode within a 35-nt coding space, whereas the 64-gene STARmap PLUS set used here repeats a 3-nt code. The 2,766-gene STARmap PLUS set uses a different backbone with an 8 + 6 split."
  replace:
    - "genome: a genome name from your genomes.yaml (mm10 here)"
    - "targets: your gene names (Aldoc here)"
    - "encoding: per gene, the 3-nt SEDAL code (AAA is the published ALDOC code of the 64-gene set, an example only)"

name: starmap
description: STARmap SNAIL padlock and primer pairs on 40-46-nt regions (Wang et al. 2018; Zeng et al. 2023 backbone)

genome: mm10

targets:
  - Aldoc

encoding:
  Aldoc:
    code: AAA

extracts:
  target_region:
    source: CDS
    transcripts: mane   # the MANE Select transcript (Ensembl canonical without one)
    length: [40, 46]
    step: 1
    layout:
      template: "{padlock_site}{gap}{primer_site}"
      parts:
        padlock_site:
          length: [19, 25]
        gap:
          length: [1, 2]   # the paper allows 0; no published pair uses it (meta)
        primer_site:
          length: [19, 25]

probes:
  padlock:
    template: "A{code_5}TA{binding}AATTATTAC{code}CATACACTAAAGATA"
    parts:
      code_5:
        expr: "encoding[target]['code']"
      binding:
        expr: "rc(target_parts['padlock_site'])"
      code:
        expr: "encoding[target]['code']"
  primer:
    template: "{binding}TA{code_rc}TTATCTT"
    parts:
      binding:
        expr: "rc(target_parts['primer_site'])"
      code_rc:
        expr: "rc(encoding[target]['code'])"

# Hybridization conditions of the source protocol (sources: meta.hybridization).
# annealing_temperature and fold_score attributes are computed under them.
hybridization:
  temperature_c: 40
  na_mM: 390
  probe_nM: 100
  formamide_pct: 10
  dntp_mM: 0   # FISH buffers hold no dNTPs (unset, the legacy 0.6 mM would apply)

attributes:
  padlock_tm:
    target: padlock.binding
    type: annealing_temperature
  primer_tm:
    target: primer.binding
    type: annealing_temperature
  padlock_gc:
    target: padlock.binding
    type: gc_content
  primer_gc:
    target: primer.binding
    type: gc_content
  # |padlock_tm - primer_tm|: remove_overlap keeps the split of each start whose
  # halves match best, as Picky 2.2 did (meta.parameter_sources).
  tm_balance:
    type: difference
    of: [padlock_tm, primer_tm]
  target_mapped_genes:
    target: target_region
    type: mapped_genes
    # The 40-46-nt region that padlock and primer bind together. Bowtie2 also
    # reports partial matches (about 25 nt or more), indels and sites with 3 or
    # more mismatches, which a search within 2 substitutions cannot see, but it
    # is a heuristic that reports at most 100 alignments: on the Ensembl 113
    # human transcriptome it flagged 97-99% of random 40- and 46-nt windows of
    # mRNAs that have a site within 2 substitutions in another gene, and listed
    # 87-90% of those genes per window. For an exhaustive search of those sites,
    # add bowtie to the genome's align_index and set aligner: bowtie, max_mismatches: 2.
    aligner: bowtie2
    strand: sense   # sites where target_region occurs, which the probes bind

post_process:
  filters:
    target_mapped_genes:
      condition: target_mapped_genes <= 1
    # Wang 2018 designed the halves for a Tm of 60 C under conditions it does
    # not state. Under the conditions above the published halves are
    # 53.5-63.3 C (5th-95th percentile), and both halves of 96.8% of the
    # published pairs lie within 50-65 C. Adjust the window with probe_nM if
    # you hybridize at 1 or 5 nM (the Tm drops by 4-6 C).
    padlock_tm:
      condition: padlock_tm >= 50 & padlock_tm <= 65
    primer_tm:
      condition: primer_tm >= 50 & primer_tm <= 65
  sorts:
    is_ascending:
      - target_mapped_genes
  remove_overlap:
    location_interval: 0
    prefer: tm_balance   # of the splits of a start, the one whose halves' Tm match best
  equal_space:
    number_desired: 4

summary:
  report_name: rna_report
  attributes:
    - padlock_tm
    - primer_tm
    - padlock_gc
    - primer_gc
    - tm_balance
    - target_mapped_genes
