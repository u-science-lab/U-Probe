# U-Probe protocol template: smFISH with multiple singly labelled oligos (Stellaris-style).
# Copy: `uprobe templates show smfish_stellaris -o protocol.yaml`, then replace
# everything under meta.replace. The workflow ignores the `meta` block.
meta:
  name: smfish_stellaris
  technology: smFISH, multiple singly labelled oligos (Stellaris-style)
  description: >-
    Each probe is a single 20-nt oligo, the reverse complement of the RNA,
    labelled with one fluorophore at its 3' end (3' amine + NHS-ester dye, a
    synthesis modification that is not part of the designed sequence). Up to
    48 probes tile one RNA with a minimum gap between binding sites; the
    combined signal of many singly labelled oligos makes each RNA molecule a
    diffraction-limited spot. Raj et al. 2008 used oligos of roughly 17-22 nt
    (its d2EGFP test set is 48 17-mers, although Supplementary Fig. 4 labels it
    20 nt; its Actb set is 48 20-mers), GC as close to 45% as possible and at
    least 3 nt between binding sites; the Stellaris Probe Designer uses
    18-22-nt oligos, 40-60% GC and a default spacing of 2 nt (at least 2 nt).
    This template filters GC to the designer's 40-60% and keeps 3 nt between
    binding sites, which satisfies both conventions.
  citations:
    - short: Raj et al. 2008, Nature Methods
      title: Imaging individual mRNA molecules using multiple singly labeled probes
      doi: 10.1038/nmeth.1253
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3126653/
    - short: Xiao et al. 2023, RNA
      title: >-
        Oligo design and purchase (Methods): Stellaris Probe Designer selection criteria
      doi: 10.1261/rna.079591.123
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10351894/
    - short: LGC Biosearch Technologies, Stellaris RNA FISH protocol (adherent cells)
      title: Stellaris RNA FISH protocol for adherent cells
      url: https://biosearchassets.biosearchtech.com/assetsv6/bti_stellaris_protocol_adherent_cell.pdf
    - short: LGC Biosearch Technologies, Stellaris probe design considerations
      title: Considerations for optimizing Stellaris RNA FISH probe design
      url: https://blog.biosearchtech.com/considerations-for-optimizing-stellaris-rna-fish-probe-design
  parameter_sources:
    - parameter: extracts.target_region.source and transcripts
      value: mRNA (5' UTR, CDS and 3' UTR) of the MANE Select transcript, the Ensembl canonical one without it
      source: >-
        Raj 2008, Supplement, "Probe sequences used in this study": one
        accession per gene, tiled from the start to the stop codon (e.g. Actb,
        BC063166, 48 oligos), i.e. the coding region of one reference mRNA. The Stellaris
        designer takes "an input sequence, such as an mRNA coding sequence" and
        suggests expanding a set with the 5' or 3' UTR (Biosearch, design
        considerations). U-Probe tiles the whole reference mRNA, so that genes
        whose coding sequence they share with paralogs or pseudogenes still
        reach 48 probes; source CDS gives the coding region alone.
      quote: see if your submitted sequence can be expanded by including other sequence information such as the 5' or 3' UTR for mRNA targets
    - parameter: attributes.target_mapped_genes.exempt_copies
      value: "{kmer: 30, min_shared: 0.5}"
      source: >-
        U-Probe. A gene with a transcript holding at least half of the target
        mRNA's 30-mers (a processed pseudogene, a readthrough or overlapping
        gene) is hit by any probe set, so it is listed in
        target_mapped_genes_copies instead of counted; it needs no expression
        table.
    - parameter: extracts.target_region.length
      value: 20
      source: >-
        Raj 2008, Supplementary Methods (17-22 nt) and its list of probe
        sequences: the Actb set is 48 20-mers, the d2EGFP (GFP) set 48 17-mers;
        only Supplementary Fig. 4 labels the GFP probes "20 bp". Stellaris
        oligos are 18-22 nt.
      quote: they should be roughly 17-22 bases long
    - parameter: smfish_probe.binding
      value: rc(target_region), one 3'-labelled oligo per binding site
      source: Raj 2008, Supplementary Methods
      quote: ordered with 3'-amino modifications from BioSearch Technologies
    - parameter: post_process.remove_overlap.location_interval
      value: 3
      source: >-
        The stricter of the two published conventions: Raj 2008 (Supplementary
        Methods) asks for at least 3 nt between oligos; the Stellaris Probe Designer default is 2 (Biosearch) and
        Xiao 2023 states "at least 2 nt". 3 nt satisfies both and costs few
        probes; use 2 only when the user names the Stellaris designer's spacing.
      quote: The default setting is 2, but can be reduced to 1
    - parameter: post_process.equal_space.number_desired
      value: 48
      source: Raj 2008, abstract and Supp. Fig. 4; Stellaris probe sets hold at most 48 oligos
      quote: probing each mRNA species with 48 or more short, singly labeled oligonucleotide probes
    - parameter: post_process.filters.target_mapped_genes
      value: "<= 1, no other gene with a site within 2 substitutions (Bowtie 1, exhaustive)"
      source: >-
        U-Probe approximation. The Stellaris designer excludes 20-mers with
        more than 16 nt matching other RNAs, which U-Probe does not model.
      quote: exclude 20-mer oligonucleotides with >16 nucleotide matches to other RNA(s) (Stellaris Getting Started Guide)
    - parameter: post_process.filters.target_gc
      value: ">= 0.40 and <= 0.60, the Stellaris Probe Designer's window; Raj 2008 aims at 45%"
      source: >-
        Xiao et al. 2023, RNA 29:1274-1287, Methods "Oligo design and purchase":
        20-mer oligos designed with the Stellaris Probe Designer v4.2, with
        selection criteria of 40%-60% GC content and similar melting
        temperatures; the Results call 40-60% GC "the limits of the design
        tool". Raj 2008 asked for GC "as close to 45% as possible" (dynamic
        programming; Supplement), which a position-based equal_space does not
        do: GC is a filter here, not a target. Raj's own Actb set spans 35-80%
        GC (mean 56%), so the window is the designer's, not Raj's. Neither
        source gives a Tm value, so the floor below is U-Probe's.
      quote: Selection criteria included 40%-60% GC content and similar melting temperatures.
    - parameter: post_process.filters.probe_tm
      value: ">= 37 C, the hybridization temperature, under the hybridization block (2x SSC, 10% formamide, 2.6 nM per oligo)"
      source: >-
        U-Probe floor: a probe whose Tm is below the hybridization
        temperature cannot hold its site. Neither Raj 2008 nor Stellaris
        states a Tm window. The 480 probes of Raj 2008 (Supplementary probe
        list: Actb, d2EGFP, dpp, elt-2, FAM105A, FKBP5, Mtap2, PTGS2, STL1)
        have a Tm of 31.8-67.8 C under these conditions (5th percentile 37.5,
        median 49.5), so the data do not support a higher floor; 37 C rejects
        20 of them (4%), mostly 17-mers of FAM105A (10) and FKBP5 (6).
  hybridization:
    ssc: 2x
    source: >-
      Raj 2008, Supplementary Methods (10% dextran sulfate, 2x SSC, 10%
      formamide, 3-24 h at 37 C); Stellaris protocol (10% formamide in
      hybridization buffer, 37 C for 4-16 h, 125 nM probe)
    notes: >-
      [Na+] computed from 2x SSC (0.3 M NaCl + 0.03 M trisodium citrate), the
      value OligoMiner uses for 2x SSC FISH buffers. The current Stellaris
      buffer contains proprietary additives; its older recipe was 10%
      formamide in 2x SSC with 100 mg/mL dextran sulfate.
  limitations:
    - Stellaris orders hold at most 48 probes (at least 25 recommended); equal_space keeps 48 per gene, spread evenly along the RNA, and all passing sites of a gene with fewer (summary.json reports the shortfall).
    - target_mapped_genes uses Bowtie 1 (aligner bowtie), so the genome's align_index must include bowtie; Bowtie2 cannot align 20-mers (its local mode needs at least 22 nt) and would count no off-target gene.
    - Without gene_expression every annotated gene counts as an off-target, including genes and pseudogenes the sample does not express, so target_mapped_genes <= 1 drops more probes than needed; add your expression table (see gene_expression below).
    - Genes with many paralogs or pseudogenes keep few probes under target_mapped_genes <= 1 (ACTB 16, GAPDH 6, RPL13A 1 from the Ensembl 113 human MANE mRNAs, no expression table; counts of the earlier version, with 2-nt spacing and no GC filter). The commented-out off_target_pool option (with target_mapped_genes <= 2) adds only a few probes, and 34-47% of the final probes then carry an off-target gene, because equal_space picks the 48 by position, not by cleanliness; see the numbers at off_target_pool below. The pool would pay off only with an equal_space that prefers probes free of off-targets. The recommended gene_expression settings (commented out below) do more: with a HeLa table, min_fraction_of_target 0.05 and exempt_copies, ACTB, EEF1A1, GAPDH, HSPA8, RPL13A and TUBB kept 193 probes, and 264 with gene_expression.absent set to ignore, which trusts the table to list every expressed gene (README, Copies of the target).
    - "Verified: the Stellaris Probe Designer's GC window of 40-60% (Xiao 2023, Methods) is a filter here, and the spacing is 3 nt (Raj 2008, which also satisfies the designer's 2 nt). Not published: a Tm value (the designer says only 'similar melting temperatures'), so probe_tm has a floor at the hybridization temperature (parameter_sources); and 'GC close to 45%' (Raj 2008) is not optimized, because equal_space picks by position, so check the median GC of the final set."
    - "A 18-22-nt length range (Stellaris) changes the length distribution of the whole set: remove_overlap keeps the shortest passing window at each start. Keep length 20 and report a shortfall first (references/uprobe/troubleshooting.md, Too few probes)."
  replace:
    - "genome: a genome name from your genomes.yaml (hg38 here); its align_index must include bowtie (Bowtie 1) for target_mapped_genes"
    - "targets: your gene names (GAPDH here)"
    - "smfish_probe: order with a 3' amine (or a 3' dye) for single-fluorophore labelling"

name: smfish_stellaris
description: smFISH probe set of 20-nt singly labelled oligos (Raj et al. 2008, Stellaris-style)

genome: hg38

targets:
  - GAPDH

encoding:
  GAPDH: {}

extracts:
  target_region:
    source: mRNA   # the whole mRNA: 5' UTR, CDS and 3' UTR (source: CDS for the coding region only)
    transcripts: mane   # the MANE Select transcript (Ensembl canonical without one)
    length: 20
    step: 1

probes:
  smfish_probe:
    template: "{binding}"
    parts:
      binding:
        expr: "rc(target_region)"

# Hybridization conditions of the source protocol (sources: meta.hybridization).
# annealing_temperature and fold_score attributes are computed under them.
hybridization:
  temperature_c: 37
  na_mM: 390
  formamide_pct: 10
  probe_nM: 2.6   # 125 nM of the 48-oligo set (Stellaris), per oligo
  dntp_mM: 0   # FISH buffers hold no dNTPs (unset, the legacy 0.6 mM would apply)

# Default configuration when you have the sample's expression table (uncomment;
# exempt_copies below goes with it): genes not expressed in your sample are not counted as
# off-targets (they stay listed in target_mapped_genes_unexpressed), so only
# RNAs that are present remove probes. With a HeLa table (TPM >= 1), 54% instead
# of 39% of the 20-mers of the MANE mRNAs of 30 random human genes had no
# off-target gene, and ACTB, EEF1A1, GAPDH, HSPA8, RPL13A and TUBB kept 180
# instead of 119 probes (193 with min_fraction_of_target: 0.05).
# Supply your own table, by transcript if you have one (e.g. salmon's quant.sf):
# only RNAs carrying a probe's site make false spots, not the gene's other isoforms.
# gene_expression:
#   table: expression.tsv   # a gene id or name column and a numeric column
#   # level: transcript     # for a table of transcript ids (salmon quant.sf: Name, TPM)
#   value_column: TPM
#   min_value: 1
#   min_fraction_of_target: 0.05   # an RNA at < 5% of the target's level makes few false spots
#   # absent: ignore   # genes the table lacks do not count; right for a table quantified
#   #                  # on an older annotation than the genome's, which lacks its new genes

attributes:
  target_gc:
    target: target_region
    type: gc_content
  probe_tm:
    target: smfish_probe.binding
    type: annealing_temperature
  target_mapped_genes:
    target: target_region
    type: mapped_genes
    # Bowtie 1 finds every transcript site within 2 substitutions; it needs
    # bowtie in the genome's align_index. Bowtie2's local mode cannot align
    # sequences shorter than 22 nt, so with aligner: bowtie2 these 20-mers
    # would count no off-target gene at all.
    aligner: bowtie
    max_mismatches: 2
    strand: sense   # sites where target_region occurs, which rc(target_region) binds
    # Genes that copy the target (processed pseudogenes, readthrough genes) are
    # listed in target_mapped_genes_copies instead of counted; no expression
    # table is needed.
    exempt_copies: {kmer: 30, min_shared: 0.5}   # a gene holding half the target's 30-mers is hit by any probe set

post_process:
  filters:
    # No other gene with a site within 2 substitutions (the count includes the target).
    target_mapped_genes:
      condition: target_mapped_genes <= 1
    # GC window of the Stellaris Probe Designer (Xiao 2023); check the final set with
    # check_probes.py --gc 0.40 0.60.
    target_gc:
      condition: target_gc >= 0.40 & target_gc <= 0.60
    # Tm floor: the hybridization temperature (meta.parameter_sources; 4% of the
    # published Raj 2008 probes are below it under these conditions).
    probe_tm:
      condition: probe_tm >= 37
  sorts:
    is_ascending:
      - target_mapped_genes
  remove_overlap:
    location_interval: 3   # Raj 2008 (at least 3 nt); the Stellaris designer needs 2, so 3 satisfies both
  # Option for genes with many paralogs or pseudogenes: a false spot needs many
  # probes of the set on one RNA, so allow one off-target gene per probe (set
  # the filter above to target_mapped_genes <= 2) and at most 2 probes of the
  # set per off-target gene (uncomment off_target_pool). It runs after
  # remove_overlap and before equal_space picks the 48. The gain is small and
  # costs cleanliness, measured on Ensembl 113 human genes (this template on
  # the MANE Select mRNAs; probes with <= 1 / with the option, and the share of
  # final probes with an off-target gene under the option):
  #   30 random genes, no expression table:  1,231 / 1,249 probes (24 genes
  #                                          get 48 either way); 47%
  #   same, HeLa expression (TPM >= 1):      1,303 / 1,312 (26 get 48); 34%
  #   ACTB, EEF1A1, GAPDH, HSPA8, RPL13A,
  #   TUBB, no expression table:             119 / 132 (1 gets 48); 45%
  #   same, HeLa expression:                 180 / 195 (2 get 48); 36%
  # equal_space picks by position, not by cleanliness, so the option mostly
  # swaps clean probes for probes with an off-target gene; it would pay off
  # with an equal_space that prefers probes free of off-targets.
  # off_target_pool:
  #   attribute: target_mapped_genes
  #   max_probes_per_gene: 2
  equal_space:
    number_desired: 48

summary:
  report_name: rna_report
  attributes:
    - target_gc
    - probe_tm
    - target_mapped_genes
